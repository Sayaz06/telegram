  const w = picker.offsetWidth || 300;
  picker.style.left = Math.max(8, Math.min(r.left, window.innerWidth-w-8))+"px";
  picker.style.top = Math.max(8, r.top-56)+"px";
  picker.querySelectorAll(".react-btn").forEach(btn=>{
    btn.onclick = (e)=>{ e.stopPropagation(); picker.hidden = true; sendReaction(msg, btn.dataset.emoji); };
  });
}
async function sendReaction(msg, emoji){
  if(!activeChatId || !tgReady) return;
  const cid = activeChatId;
  const removing = msg.myReacts && msg.myReacts[emoji];
  try{
    await client.invoke(new Api.messages.SendReaction({
      peer: entities.get(cid),
      msgId: Number(msg.id),
      reaction: removing ? [] : [new Api.ReactionEmoji({ emoticon: emoji })],
    }));
    // kemaskini paparan setempat
    msg.reactions = msg.reactions || {};
    msg.myReacts = msg.myReacts || {};
    Object.keys(msg.myReacts).forEach(k=>{ msg.reactions[k] = (msg.reactions[k]||1)-1; if(msg.reactions[k]<=0) delete msg.reactions[k]; });
    msg.myReacts = {};
    if(!removing){ msg.reactions[emoji] = (msg.reactions[emoji]||0)+1; msg.myReacts[emoji] = true; }
    if(cid===activeChatId) renderMessages(cid, chatMsgs[cid], true);
  }catch(e){
    const m = String(e.message||e);
    toast(m.includes("REACTION_INVALID")||m.includes("REACTION_EMPTY") ? "Reaksi ini tidak dibenarkan dalam chat ini" : "Gagal reaksi: "+m);
  }
}

// ══════════════════════════════════════════════════════════════════
// PADAM
// ══════════════════════════════════════════════════════════════════
el("btn-del-everyone").onclick = ()=>{ if(deleteTargetId) deleteMsg(deleteTargetId, true); };
el("btn-del-me").onclick = ()=>{ if(deleteTargetId) deleteMsg(deleteTargetId, false); };
el("btn-del-cancel").onclick = ()=>{ el("del-modal").hidden = true; deleteTargetId = null; };
async function deleteMsg(id, revoke){
  el("del-modal").hidden = true;
  deleteTargetId = null;
  const cid = activeChatId;
  try{
    await client.deleteMessages(entities.get(cid), [Number(id)], { revoke });
    chatMsgs[cid] = (chatMsgs[cid]||[]).filter(x=>x.id!==String(id));
    renderMessages(cid, chatMsgs[cid], true);
    saveMsgCache(cid);
    toast(revoke ? "Dipadam untuk semua" : "Dipadam untuk anda");
  }catch(e){ toast("Gagal padam: "+(e.message||e)); }
}

// ══════════════════════════════════════════════════════════════════
// MAJUKAN
// ══════════════════════════════════════════════════════════════════
function showForwardSheet(msg){
  forwardMsgId = msg.id;
  const fromCid = activeChatId;
  const list = el("forward-list");
  list.innerHTML = dialogs.slice(0,50).map(d=>`
    <div class="fw-item" data-id="${escHtml(d.cid)}">
      <div class="fw-avatar" style="background:${nameColor(d.name)}">${avatarCache.get(d.cid)?`<img src="${avatarCache.get(d.cid)}" alt=""/>`:escHtml(avatarInitial(d.name||"?"))}</div>
      <div class="fw-name">${escHtml(d.name||"?")}</div>
    </div>`).join("");
  list.querySelectorAll(".fw-item").forEach(item=>{
    item.onclick = async ()=>{
      el("forward-sheet").hidden = true;
      try{
        await client.forwardMessages(entities.get(item.dataset.id), { messages: [Number(forwardMsgId)], fromPeer: entities.get(fromCid) });
        toast("Dimajukan ✓");
      }catch(e){ toast("Gagal majukan: "+(e.message||e)); }
    };
  });
  el("forward-sheet").hidden = false;
}
el("btn-cancel-forward").onclick = ()=>{ el("forward-sheet").hidden = true; };

// ══════════════════════════════════════════════════════════════════
// PAPARAN MEDIA
// ══════════════════════════════════════════════════════════════════
function openMediaViewer(src, type){
  const body = el("mv-body");
  body.innerHTML = type==="video"
    ? `<video src="${src}" controls autoplay playsinline style="max-width:100%;max-height:100%"></video>`
    : `<img src="${src}" alt="Gambar" style="max-width:100%;max-height:100%;object-fit:contain"/>`;
  el("media-viewer-name").textContent = activeChatData?.name || "";
  el("media-viewer").hidden = false;
}
el("btn-close-media").onclick = ()=>{
  el("media-viewer").hidden = true;
  el("mv-body").innerHTML = "";
};

// ══════════════════════════════════════════════════════════════════
// NAVIGASI MUDAH ALIH
// ══════════════════════════════════════════════════════════════════
function closeChat(){
  activeChatId = null;
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  el("chat-view").hidden = true;
  el("empty-state").hidden = false;
  el("sidebar").classList.add("open");
  renderDialogs();
}
el("back-btn").onclick = (e)=>{
  e && e.stopPropagation();
  closeChat();
};
window.addEventListener("popstate", ()=>{
  if(!el("media-viewer").hidden){ el("btn-close-media").onclick(); return; }
  if(!el("profile-view").hidden){ closeProfile(); return; }
  if(!el("chat-search-bar").hidden){ closeChatSearch(); return; }
  if(activeChatId) closeChat();
});


// ── SYNC ─────────────────────────────────────────────────────────
el("btn-sync").onclick = async ()=>{
  if(!tgReady){ startTelegram(); return; }
  toast("Menyegerakkan...");
  await loadDialogs();
  if(activeChatId) openChat(activeChatId);
  if("Notification" in window && Notification.permission==="default") Notification.requestPermission().catch(()=>{});
};

// Bila app dibuka semula selepas lama di latar
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState==="visible" && tgReady){
    loadDialogs();
    if(activeChatId) markRead(activeChatId);
  }
});

// ── PWA: daftar service worker (perlu untuk pasang app ke skrin utama) ──
if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(e=>console.warn("SW gagal:", e));
  });
}

</script>
