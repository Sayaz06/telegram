<!DOCTYPE html>
<html lang="ms" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>MyGram</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="theme-color" content="#2196f3"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>

<!-- Firebase SDK -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.7.1/firebase-auth-compat.min.js"></script>
<!-- Telegram MTProto (gramjs) — dari repo sayaz06/telegrambackend melalui jsDelivr; jika gagal, guna salinan tempatan -->
<script src="https://cdn.jsdelivr.net/gh/sayaz06/telegrambackend@main/gramjs.js"></script>
<script>window.GramJS || document.write('<script src="gramjs.js"><\/script>');</script>

<style>
/* ── TOKENS ──────────────────────────────────────────────────── */
:root {
  --bg: #f4f4f4;
  --surface: #ffffff;
  --sidebar-bg: #ffffff;
  --chat-bg: #dfe4ea;
  --bubble-out: #d0eafb;
  --bubble-in: #ffffff;
  --accent: #2196f3;
  --accent2: #0d8ae8;
  --fg: #1a1a1a;
  --fg2: #555;
  --fg3: #999;
  --border: #e0e0e0;
  --hover: #f0f4f8;
  --shadow: 0 1px 4px rgba(0,0,0,.12);
  --radius: 18px;
  --radius-sm: 8px;
  --online: #4caf50;
  --danger: #f44336;
  --warn: #ff9800;
  --media-bg: #000;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1a2e;
    --surface: #16213e;
    --sidebar-bg: #0f3460;
    --chat-bg: #0d0d1a;
    --bubble-out: #1e5799;
    --bubble-in: #1e2d40;
    --fg: #e8e8e8;
    --fg2: #aaa;
    --fg3: #666;
    --border: #2a2a4a;
    --hover: #1e2d40;
    --shadow: 0 1px 4px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1a2e;
  --surface: #16213e;
  --sidebar-bg: #0f3460;
  --chat-bg: #0d0d1a;
  --bubble-out: #1e5799;
  --bubble-in: #1e2d40;
  --fg: #e8e8e8;
  --fg2: #aaa;
  --fg3: #666;
  --border: #2a2a4a;
  --hover: #1e2d40;
  --shadow: 0 1px 4px rgba(0,0,0,.4);
  color-scheme: dark;
}

/* ── RESET ───────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;font-size:14px;background:var(--bg);color:var(--fg)}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea{font-family:inherit;color:inherit;background:none;border:none;outline:none}
img{max-width:100%;display:block}
a{color:var(--accent);text-decoration:none}
[hidden]{display:none!important}

/* ── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── APP LAYOUT ──────────────────────────────────────────────── */
#app{display:flex;height:100%;overflow:hidden}
#sidebar{width:320px;min-width:320px;display:flex;flex-direction:column;background:var(--sidebar-bg);border-right:1px solid var(--border);position:relative;z-index:10}
#main{flex:1;display:flex;flex-direction:column;background:var(--chat-bg);position:relative;overflow:hidden}

@media(max-width:640px){
  #sidebar{position:fixed;inset:0;width:100%;transform:translateX(-100%);transition:transform .25s ease;z-index:100}
  #sidebar.open{transform:translateX(0)}
  #main{width:100%}
}

/* ── LOGIN SCREEN ────────────────────────────────────────────── */
#login-screen{position:fixed;inset:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;padding:32px}
#login-screen .logo{font-size:64px;line-height:1}
#login-screen h1{font-size:24px;font-weight:600;color:var(--accent)}
#login-screen p{color:var(--fg2);text-align:center;max-width:300px;line-height:1.5}
.login-card{background:var(--bg);border-radius:16px;padding:24px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.login-card label{font-size:12px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.5px}
.inp-wrap{display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s}
.inp-wrap:focus-within{border-color:var(--accent)}
.inp-wrap select,.inp-wrap input{padding:10px 12px;background:none;font-size:14px;width:100%}
.inp-wrap select{width:auto;flex-shrink:0;border-right:1px solid var(--border);cursor:pointer}
.btn-primary{background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-size:15px;font-weight:600;text-align:center;transition:background .2s}
.btn-primary:hover{background:var(--accent2)}
.btn-primary:disabled{opacity:.5;cursor:default}
#login-status{text-align:center;color:var(--fg2);font-size:13px;min-height:18px}
#otp-wrap{display:none;flex-direction:column;gap:12px}
#login-screen.otp-step #otp-wrap{display:flex}
#login-screen.otp-step #phone-wrap{display:none}

/* ── SIDEBAR HEADER ──────────────────────────────────────────── */
#sidebar-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--sidebar-bg)}
#sidebar-header .app-name{font-weight:700;font-size:16px;color:var(--accent);flex:1}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg2);transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:var(--hover)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}

/* ── SEARCH BAR ──────────────────────────────────────────────── */
#search-wrap{padding:8px 12px;border-bottom:1px solid var(--border)}
#search-inp{width:100%;background:var(--hover);border-radius:20px;padding:8px 14px;font-size:13px;color:var(--fg)}
#search-inp::placeholder{color:var(--fg3)}

/* ── DIALOG LIST ──────────────────────────────────────────────── */
#dialog-list{flex:1;overflow-y:auto}
.dialog-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.dialog-item:hover{background:var(--hover)}
.dialog-item.active{background:var(--hover)}
.d-avatar{width:46px;height:46px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:16px;flex-shrink:0;overflow:hidden;position:relative}
.d-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.d-avatar .online-dot{position:absolute;bottom:1px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--online);border:2px solid var(--sidebar-bg)}
.d-info{flex:1;min-width:0}
.d-row1{display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.d-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-time{font-size:11px;color:var(--fg3);flex-shrink:0}
.d-row2{display:flex;justify-content:space-between;align-items:center;gap:4px}
.d-preview{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.d-badge{background:var(--accent);color:#fff;border-radius:10px;padding:1px 6px;font-size:11px;font-weight:600;flex-shrink:0}
.d-muted .d-badge{background:var(--fg3)}

/* ── CHAT HEADER ──────────────────────────────────────────────── */
#chat-header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);min-height:56px}
#back-btn{display:none}
#hamburger-btn{display:none!important}
@media(max-width:640px){
  #back-btn{display:flex}
  #sidebar{transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
}
#chat-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;flex-shrink:0;overflow:hidden}
#chat-avatar img{width:100%;height:100%;object-fit:cover}
#chat-info{flex:1;min-width:0}
#chat-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chat-status{font-size:12px;color:var(--fg3)}
#chat-status.online{color:var(--online)}

/* ── EMPTY STATE ──────────────────────────────────────────────── */
#empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--fg3)}
#empty-state .big-icon{font-size:80px}
#empty-state p{font-size:15px}

/* ── MESSAGES AREA ───────────────────────────────────────────── */
#msgs-wrap{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.date-divider{text-align:center;padding:6px 0;color:var(--fg3);font-size:12px;position:sticky;top:0;z-index:1}
.date-divider span{background:rgba(0,0,0,.12);border-radius:12px;padding:3px 10px}

/* ── BUBBLE ──────────────────────────────────────────────────── */
.msg-row{display:flex;gap:6px;max-width:100%;padding:1px 0}
.msg-row.out{flex-direction:row-reverse}
.msg-row.in .msg-bubble-wrap{align-items:flex-start}
.msg-row.out .msg-bubble-wrap{align-items:flex-end}
.msg-avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:600;flex-shrink:0;align-self:flex-end;overflow:hidden}
.msg-avatar-sm img{width:100%;height:100%;object-fit:cover}
.msg-bubble-wrap{display:flex;flex-direction:column;max-width:68%;min-width:80px}
@media(max-width:640px){.msg-bubble-wrap{max-width:88%}}
.msg-sender{font-size:12px;font-weight:600;color:var(--accent);padding:0 4px;margin-bottom:2px}
.bubble{background:var(--bubble-in);border-radius:var(--radius);border-bottom-left-radius:4px;padding:7px 10px;box-shadow:var(--shadow);position:relative;word-break:break-word;line-height:1.45}
.msg-row.out .bubble{background:var(--bubble-out);border-bottom-left-radius:var(--radius);border-bottom-right-radius:4px}
.bubble .msg-text{white-space:pre-wrap}
.bubble-meta{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:3px}
.msg-time{font-size:10px;color:var(--fg3)}
.tick{font-size:13px;color:var(--fg3)}
.tick.read{color:var(--accent)}

/* ── REPLY PREVIEW ───────────────────────────────────────────── */
.reply-quote{border-left:3px solid var(--accent);padding:3px 8px;background:rgba(33,150,243,.08);border-radius:4px;margin-bottom:5px;cursor:pointer}
.reply-quote .rq-name{font-size:11px;font-weight:600;color:var(--accent)}
.reply-quote .rq-text{font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ── MEDIA IN BUBBLE ──────────────────────────────────────────── */
.bubble-media{border-radius:12px;overflow:hidden;max-width:280px;margin-bottom:4px;cursor:pointer}
.bubble-media img,.bubble-media video{width:100%;max-height:320px;object-fit:cover;display:block}
.bubble-media.sticker{background:transparent!important;box-shadow:none!important;border-radius:0;max-width:160px}
.bubble-media.sticker img{max-height:160px;object-fit:contain}
.file-bubble{display:flex;align-items:center;gap:8px;background:var(--hover);border-radius:10px;padding:8px;min-width:200px;cursor:pointer}
.file-icon{font-size:28px;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-weight:500;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--fg3)}
.audio-bubble{display:flex;align-items:center;gap:8px;min-width:180px;padding:4px 0}
.audio-bubble button{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.audio-progress{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;cursor:pointer}
.audio-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .1s}

/* ── REACTIONS ───────────────────────────────────────────────── */
.msg-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.reaction-chip{background:var(--hover);border:1px solid var(--border);border-radius:12px;padding:2px 7px;font-size:13px;cursor:pointer;transition:background .15s;user-select:none}
.reaction-chip:hover,.reaction-chip.mine{background:rgba(33,150,243,.15);border-color:var(--accent)}

/* ── CONTEXT MENU ────────────────────────────────────────────── */
#ctx-menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:500;min-width:180px;overflow:hidden;animation:fadeIn .1s ease}
@keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-item{padding:10px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .12s;font-size:14px}
.ctx-item:hover{background:var(--hover)}
.ctx-item.danger{color:var(--danger)}
.ctx-sep{height:1px;background:var(--border);margin:2px 0}

/* ── REACTION PICKER ──────────────────────────────────────────── */
#reaction-picker{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:501;display:flex;gap:4px;padding:6px 10px;animation:fadeIn .1s ease}
.react-btn{font-size:22px;cursor:pointer;padding:2px 4px;border-radius:6px;transition:transform .15s;line-height:1}
.react-btn:hover{transform:scale(1.3)}

/* ── FORWARD SHEET ────────────────────────────────────────────── */
#forward-sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:600;display:flex;align-items:flex-end;justify-content:center}
#forward-sheet .sheet{background:var(--surface);border-radius:16px 16px 0 0;width:100%;max-width:480px;max-height:70vh;display:flex;flex-direction:column;padding:16px 0}
#forward-sheet h3{padding:0 16px 12px;font-size:16px;font-weight:600}
#forward-list{flex:1;overflow-y:auto}
.fw-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .12s}
.fw-item:hover{background:var(--hover)}
.fw-avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.fw-name{font-weight:500}

/* ── DELETE CONFIRM ───────────────────────────────────────────── */
#del-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:700;display:flex;align-items:center;justify-content:center;padding:24px}
#del-modal .modal{background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px}
#dl-modal{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:700;display:flex;align-items:center;justify-content:center;padding:24px}
#dl-modal .modal{background:var(--surface);border-radius:14px;padding:20px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:10px}
#dl-modal h3{font-size:16px;font-weight:600;word-break:break-all}
#dl-modal p{color:var(--fg2);font-size:13px}
/* ── MENU CHAT, CARIAN, PROFIL ─────────────────────────────── */
#chat-view{position:relative}
#chat-avatar,#chat-info{cursor:pointer}
#chat-search-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--border)}
#chat-search-inp{flex:1;min-width:0;background:var(--hover);border-radius:18px;padding:8px 14px;font-size:16px;color:var(--fg)}
#chat-search-count{font-size:12px;color:var(--fg3);white-space:nowrap}
#chat-search-results{max-height:45vh;overflow-y:auto;background:var(--surface);border-bottom:1px solid var(--border)}
.sr-item{padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer}
.sr-item:hover{background:var(--hover)}
.sr-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--fg3)}
.sr-top b{color:var(--accent);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-text{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.sr-text mark{background:rgba(255,193,7,.45);color:inherit;border-radius:2px}
#jump-latest{position:absolute;right:14px;bottom:76px;z-index:20;background:var(--surface);color:var(--accent);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:600}
#profile-view{position:fixed;inset:0;background:var(--bg);z-index:450;display:flex;flex-direction:column}
.pf-head{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--border)}
.pf-head .pf-title{flex:1;font-weight:600;font-size:16px}
.pf-scroll{flex:1;overflow-y:auto;padding-bottom:24px}
.pf-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 16px 16px;background:var(--surface)}
.pf-avatar{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:600;overflow:hidden;cursor:pointer}
.pf-avatar img{width:100%;height:100%;object-fit:cover}
.pf-name{font-size:22px;font-weight:600;text-align:center;text-wrap:balance}
.pf-status{font-size:14px;color:var(--fg3)}
.pf-status.online{color:var(--online)}
.pf-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:420px;margin-top:12px}
.pf-actions button{background:var(--hover);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent)}
.pf-actions button span{font-size:20px;line-height:1}
.pf-card{background:var(--surface);margin-top:10px;padding:4px 0}
.pf-row{padding:10px 18px;cursor:pointer}
.pf-row .v{font-size:15px;word-break:break-word;white-space:pre-wrap}
.pf-row .k{font-size:12px;color:var(--fg3);margin-top:2px}
.pf-tabs{display:flex;gap:4px;padding:10px 12px 0;background:var(--surface);margin-top:10px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border)}
.pf-tab{flex:1;padding:10px 0;font-size:14px;font-weight:600;color:var(--fg3);border-bottom:2px solid transparent;text-align:center}
.pf-tab.active{color:var(--accent);border-color:var(--accent)}
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--surface)}
.pf-tile{position:relative;aspect-ratio:1;background:var(--hover);overflow:hidden;cursor:pointer;max-width:100%}
.pf-tile img{width:100%;height:100%;object-fit:cover}
.pf-tile .dur{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;border-radius:8px;padding:1px 6px}
.pf-list{background:var(--surface)}
.pf-li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;min-width:0}
.pf-li .ico{width:40px;height:40px;border-radius:8px;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pf-li .tx{flex:1;min-width:0}
.pf-li .t1{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-li .t2{font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-li a{color:var(--accent)}
.pf-empty{padding:32px 16px;text-align:center;color:var(--fg3);font-size:13px;background:var(--surface)}
#del-modal h3{font-size:16px;font-weight:600}
#del-modal p{color:var(--fg2);font-size:14px;line-height:1.5}
.del-actions{display:flex;flex-direction:column;gap:8px}
.btn-del-ev{background:var(--danger);color:#fff;border-radius:10px;padding:11px;font-size:14px;font-weight:600;text-align:center}
.btn-del-me{background:var(--hover);color:var(--fg);border-radius:10px;padding:11px;font-size:14px;font-weight:600;text-align:center}
.btn-cancel{background:none;color:var(--fg2);text-align:center;padding:8px;font-size:14px}

/* ── MEDIA VIEWER ────────────────────────────────────────────── */
#media-viewer{position:fixed;inset:0;background:#000;z-index:800;display:flex;flex-direction:column}
#media-viewer .mv-header{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#fff}
#media-viewer .mv-header button{color:#fff}
#media-viewer .mv-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
#media-viewer img,#media-viewer video{max-width:100%;max-height:100%;object-fit:contain}

/* ── EMOJI PICKER ────────────────────────────────────────────── */
#emoji-picker{position:absolute;bottom:60px;left:0;width:320px;max-width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ep-tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.ep-tab{padding:8px 10px;font-size:18px;cursor:pointer;border-bottom:2px solid transparent;flex-shrink:0;transition:border-color .15s}
.ep-tab.active{border-color:var(--accent)}
.ep-search{padding:6px 10px;border-bottom:1px solid var(--border)}
.ep-search input{width:100%;background:var(--hover);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--fg)}
.ep-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:6px;overflow-y:auto;max-height:200px}
.ep-cell{font-size:22px;text-align:center;cursor:pointer;border-radius:6px;padding:3px;transition:background .12s;line-height:1.3}
.ep-cell:hover{background:var(--hover)}
.ep-sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;overflow-y:auto;max-height:200px}
.ep-sticker{cursor:pointer;border-radius:8px;padding:4px;transition:background .12s}
.ep-sticker:hover{background:var(--hover)}
.ep-sticker img{width:60px;height:60px;object-fit:contain}

/* ── INPUT AREA ──────────────────────────────────────────────── */
#input-area{background:var(--surface);border-top:1px solid var(--border);position:relative}
#reply-bar{display:flex;align-items:center;gap:8px;padding:6px 10px 0;background:var(--surface)}
#reply-bar .rb-content{flex:1;min-width:0;border-left:3px solid var(--accent);padding-left:8px}
#reply-bar .rb-name{font-size:11px;font-weight:600;color:var(--accent)}
#reply-bar .rb-text{font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#reply-bar button{color:var(--fg3);padding:4px}
#input-row{display:flex;align-items:flex-end;gap:4px;padding:6px 8px}
.inp-action{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg2);flex-shrink:0;transition:background .12s}
.inp-action:hover{background:var(--hover);color:var(--accent)}
.inp-action svg{width:22px;height:22px;fill:currentColor}
#msg-inp{flex:1;background:var(--hover);border-radius:20px;padding:9px 14px;font-size:14px;resize:none;max-height:120px;overflow-y:auto;line-height:1.4;color:var(--fg)}
#msg-inp::placeholder{color:var(--fg3)}
#send-btn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s,transform .15s}
#send-btn:hover{background:var(--accent2);transform:scale(1.05)}
#send-btn svg{width:20px;height:20px;fill:currentColor}

/* ── VOICE NOTE REC ───────────────────────────────────────────── */
#voice-overlay{position:absolute;inset:0;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:16px;z-index:10}
.voice-timer{font-size:20px;font-weight:600;color:var(--danger)}
.voice-pulse{width:14px;height:14px;border-radius:50%;background:var(--danger);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TYPING INDICATOR ────────────────────────────────────────── */
#typing-indicator{padding:4px 16px;color:var(--fg3);font-size:12px;font-style:italic;min-height:18px}

/* ── LOAD MORE ───────────────────────────────────────────────── */
#load-more-btn{align-self:center;padding:6px 18px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--fg2);font-size:12px;cursor:pointer;transition:background .15s}
#load-more-btn:hover{background:var(--hover)}

/* ── TOAST ───────────────────────────────────────────────────── */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* ── MOBILE MESRA PHONE ──────────────────────────────────────── */
@media(max-width:640px){
  /* Login */
  #login-screen{padding:20px 16px;gap:12px}
  #login-screen .logo{font-size:52px}
  #login-screen h1{font-size:20px}
  .login-card{padding:18px 16px;gap:10px;border-radius:12px}

  /* Input area lebih selesa */
  #msg-inp{font-size:16px;padding:10px 14px} /* 16px elak zoom iOS */
  #input-row{padding:8px 6px}
  .inp-action{width:40px;height:40px}
  #send-btn{width:44px;height:44px}

  /* Bubble lebih lebar */
  .msg-bubble-wrap{max-width:90%}

  /* Sidebar dialog item lebih besar utk jari */
  .dialog-item{padding:12px 14px}
  .d-avatar{width:50px;height:50px}
  .d-name{font-size:15px}
  .d-preview{font-size:13px}

  /* Chat header */
  #chat-header{padding:8px 10px;min-height:54px}
  #chat-name{font-size:15px}

  /* Emoji picker penuh lebar */
  #emoji-picker{width:100%;left:0;right:0;bottom:56px;border-radius:14px 14px 0 0;border-bottom:none}
  .ep-grid{grid-template-columns:repeat(7,1fr);max-height:220px}

  /* Scroll msgs selesa */
  #msgs-wrap{padding:6px 10px}

  /* Forward sheet */
  #forward-sheet .sheet{max-height:75vh}

  /* Context menu */
  #ctx-menu{min-width:200px}
  .ctx-item{padding:13px 16px;font-size:15px}

  /* Toast naik sikit dari keyboard */
  #toast{bottom:90px;font-size:14px;max-width:85vw;text-align:center}

  /* Empty state */
  #empty-state .big-icon{font-size:64px}
  #empty-state p{font-size:14px}
}


/* ── DIRECT TELEGRAM ADDITIONS ─────────────────────────────── */
#fb-login-wrap,#tg-phone-wrap,#tg-code-wrap,#tg-pass-wrap{display:flex;flex-direction:column;gap:12px}
#conn-bar{padding:6px 12px;font-size:12px;text-align:center;background:var(--hover);color:var(--fg2)}
#conn-bar.wait{background:rgba(255,152,0,.15);color:var(--warn)}
#conn-bar.err{background:rgba(244,67,54,.12);color:var(--danger)}
.list-note{padding:28px 16px;text-align:center;color:var(--fg3);font-size:13px}
.msgs-note{margin:auto;color:var(--fg3);font-size:13px;text-align:center;padding:16px}
.msgs-note.err{color:var(--danger)}
.service-msg{text-align:center;padding:4px 0}
.service-msg span{background:rgba(0,0,0,.12);color:var(--fg2);border-radius:12px;padding:3px 10px;font-size:12px;display:inline-block;max-width:85%}
.d-badge.muted{background:var(--fg3)}
.bubble.bare{background:transparent!important;box-shadow:none!important;padding:0}
.bubble.bare .bubble-meta{background:rgba(0,0,0,.35);border-radius:10px;padding:1px 6px;display:inline-flex;float:right}
.bubble.bare .bubble-meta .msg-time,.bubble.bare .bubble-meta .tick{color:#fff}
.bubble-media{position:relative;min-height:60px;min-width:120px}
.bubble-media.sticker{min-width:0;min-height:0}
.bubble-media.round{border-radius:50%;width:200px;height:200px;max-width:60vw;max-height:60vw}
.bubble-media.round img{width:100%;height:100%;object-fit:cover}
.media-ph{display:flex;align-items:center;justify-content:center;width:220px;max-width:100%;height:160px;background:var(--hover);color:var(--fg3);font-size:28px;border-radius:12px;animation:phPulse 1.4s ease-in-out infinite}
.media-ph.none{animation:none}
.bubble-media.sticker .media-ph{width:120px;height:120px;background:transparent}
@keyframes phPulse{0%,100%{opacity:1}50%{opacity:.55}}
.play-ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:20px;padding:6px 12px;font-size:13px;pointer-events:none;white-space:nowrap}
.audio-info{min-width:0;flex:1}
.fwd-label{font-size:12px;color:var(--accent);margin-bottom:3px}
.bubble.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{filter:none}30%{filter:brightness(.8)}}
.fw-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fw-avatar{overflow:hidden}
#chat-avatar,.d-avatar,.msg-avatar-sm{color:#fff}
</style>
</head>

function fmtTime(ts){
  if(!ts) return "";
  const d = new Date(ts);
  return d.toLocaleTimeString("ms-MY",{hour:"2-digit",minute:"2-digit"});
}
function fmtDate(ts){
  if(!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString()===now.toDateString()) return "Hari ini";
  const yes = new Date(now); yes.setDate(yes.getDate()-1);
  if(d.toDateString()===yes.toDateString()) return "Semalam";
  return d.toLocaleDateString("ms-MY",{day:"numeric",month:"short",year:"numeric"});
}
function fmtListTime(ts){

}

// ── INDEXEDDB CACHE ──────────────────────────────────────────────
let idbP = null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res)=>{
    try{
      const r = indexedDB.open("mygram", 1);
      r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
      r.onsuccess = ()=> res(r.result);
      r.onerror = ()=> res(null);
    }catch(e){ res(null); }
  });
  return idbP;
}
async function cacheGet(key){
  const d = await idb(); if(!d) return null;
  return new Promise(res=>{
    try{
      const q = d.transaction("kv").objectStore("kv").get(key);
      q.onsuccess = ()=> res(q.result ?? null);
      q.onerror = ()=> res(null);
    }catch(e){ res(null); }
  });
}
async function cacheSet(key, val){
  const d = await idb(); if(!d) return;
  try{ d.transaction("kv","readwrite").objectStore("kv").put(val, key); }catch(e){}
}

let tgCreds = null;
async function startTelegram(){
  if(!G){ setConn("Fail gramjs.js tidak dijumpai. Upload gramjs.js ke repo.", "err"); return; }
  setConn("Menyambung ke Telegram...", "wait");
  try{
    const credSnap = await doc(`${P}/mygram_session/creds`).get();
    if(!credSnap.exists){ setConn("Creds Telegram tiada dalam Firestore (mygram_session/creds).", "err"); return; }
    tgCreds = credSnap.data();
    const sessSnap = await doc(`${P}/mygram_session/main`).get();
    const sessStr = sessSnap.exists ? (sessSnap.data().session||"") : "";

    const session = new StringSession(sessStr);
    await session.load();
    // Session dari server (IP) → tukar ke alamat WebSocket Telegram untuk browser
    if(session.dcId){
      session.setDC(session.dcId, `${WEB_DC[session.dcId]||"venus"}.web.telegram.org`, 443);
    }
    client = new TelegramClient(session, parseInt(tgCreds.apiId), String(tgCreds.apiHash), {
      useWSS: true,
      connectionRetries: 5,
      autoReconnect: true,
      deviceModel: "MyGram PWA",
      appVersion: "2.0",
    });
    client.setLogLevel("error");
    await client.connect();
    const ok = sessStr ? await client.checkAuthorization() : false;
    if(!ok){
      setConn("Perlu log masuk Telegram", "err");
      tgLoginFlow();
      return;
    }
    await onTgReady();
  }catch(e){
    console.error(e);
    const m = String(e.message||e);
    if(/AUTH_KEY_UNREGISTERED|AUTH_KEY_DUPLICATED|SESSION_REVOKED|USER_DEACTIVATED/.test(m)){
      setConn("Session Telegram tamat. Sila log masuk semula.", "err");
      tgLoginFlow();
    } else {
      setConn("Gagal sambung: "+m+" — tekan Sync untuk cuba lagi", "err");
    }
  }
}

async function saveSession(){
  try{
    await doc(`${P}/mygram_session/main`).set({
      session: client.session.save(),
      source: "browser",
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ console.error("Gagal simpan session", e); }
}

    if(client.connected === false) setConn("Terputus — menyambung semula...", "wait");
    else if(!el("conn-bar").classList.contains("err")) setConn("");
  }, 3000);
}

function entName(e){
  if(!e) return "?";
  if(e.self) return "Mesej Tersimpan";
  if(e.className==="User") return [e.firstName,e.lastName].filter(Boolean).join(" ") || (e.username?"@"+e.username:"") || "Akaun Dipadam";
  return e.title || "?";
}
function peerKey(x){
  try{ return String(G.utils.getPeerId(x)); }catch(e){ return ""; }
}
function msgPreview(m){
  if(!m) return "";
  if(m.className==="MessageService") return "📢 Aktiviti";
  const t = m.message || "";
  const mt = detectMedia(m).type;
  const icon = {photo:"📷 Gambar",video:"🎬 Video",gif:"GIF",sticker:"Sticker",voice:"🎤 Mesej suara",audio:"🎵 Audio",document:"📎 Fail",location:"📍 Lokasi",poll:"📊 Undian",contact:"👤 Kenalan",round:"🎥 Video bulat"}[mt];
  if(icon) return t ? icon.split(" ")[0]+" "+t : icon;
  return t;
}

async function loadDialogs(){
  if(!client || !tgReady) return;
  try{
    const ds = await client.getDialogs({ limit: 100 });
    dialogs = ds.filter(d=>d.entity).map(d=>{
      const e = d.entity;
      const cid = peerKey(e);
      entities.set(cid, e);
      if(d.dialog && d.dialog.readOutboxMaxId) readOutbox.set(cid, d.dialog.readOutboxMaxId);
      const m = d.message;
      return {
        cid,
        name: entName(e),
        isGroup: !!(d.isGroup),
        isChannel: !!(d.isChannel && !d.isGroup),
        isUser: !!d.isUser,
        lastMsg: msgPreview(m),
        lastMsgTime: m && m.date ? new Date(m.date*1000).toISOString() : null,
        lastOut: m ? !!m.out : false,
        unread: d.unreadCount || 0,
        pinned: !!d.pinned,
        muted: !!(d.dialog && d.dialog.notifySettings && d.dialog.notifySettings.muteUntil && d.dialog.notifySettings.muteUntil*1000 > Date.now()),
        hasPhoto: !!(e.photo && e.photo.className!=="UserProfilePhotoEmpty" && e.photo.className!=="ChatPhotoEmpty"),
        online: !!(e.status && e.status.className==="UserStatusOnline"),
      };
    });
    renderDialogs();
    cacheSet("dialogs", dialogs);
    loadAvatars();
  }catch(e){
    console.error(e);
    toast("Gagal muat chat: "+(e.message||e));
  }
}

let avatarsRunning = false;
async function loadAvatars(){
  if(avatarsRunning) return;
  avatarsRunning = true;
  for(const d of dialogs.slice(0,60)){
    if(!d.hasPhoto || avatarCache.has(d.cid)) continue;
    try{
      let blob = await cacheGet("av:"+d.cid);
      if(!blob){
        const ent = entities.get(d.cid);
        if(!ent) continue;
        const buf = await client.downloadProfilePhoto(ent, { isBig:false });
        if(!buf || !buf.length) continue;
        blob = new Blob([buf], { type:"image/jpeg" });
        cacheSet("av:"+d.cid, blob);
      }
      avatarCache.set(d.cid, URL.createObjectURL(blob));
      const node = document.querySelector(`.dialog-item[data-id="${CSS.escape(d.cid)}"] .d-avatar`);
      if(node) node.innerHTML = `<img src="${avatarCache.get(d.cid)}" alt=""/>${d.online?'<span class="online-dot"></span>':""}`;
      if(d.cid===activeChatId) el("chat-avatar").innerHTML = `<img src="${avatarCache.get(d.cid)}" alt=""/>`;
    }catch(e){ /* abaikan */ }
  }
  avatarsRunning = false;
}

function detectMedia(m){
  const md = m && m.media;
  if(!md) return { type:null };
  const cn = md.className;
  if(cn==="MessageMediaPhoto" && md.photo) return { type:"photo", mime:"image/jpeg" };
  if(cn==="MessageMediaGeo" || cn==="MessageMediaGeoLive" || cn==="MessageMediaVenue")
    return { type:"location", lat: md.geo?.lat, lng: md.geo?.long, title: md.title };
  if(cn==="MessageMediaPoll") return { type:"poll", question: md.poll?.question?.text ?? md.poll?.question };
  if(cn==="MessageMediaContact") return { type:"contact", name:[md.firstName,md.lastName].filter(Boolean).join(" "), phone: md.phoneNumber };
  if(cn==="MessageMediaDocument" && md.document){
    const d = md.document;
    const mime = d.mimeType || "";
    const attrs = d.attributes || [];
    const fn = attrs.find(a=>a.className==="DocumentAttributeFilename");
    const au = attrs.find(a=>a.className==="DocumentAttributeAudio");
    const vi = attrs.find(a=>a.className==="DocumentAttributeVideo");
    const isSticker = attrs.some(a=>a.className==="DocumentAttributeSticker");
    const isGif = attrs.some(a=>a.className==="DocumentAttributeAnimated");
    const base = { mime, fileName: fn?fn.fileName:null, fileSize: d.size?Number(d.size):0, hasThumb: !!(d.thumbs&&d.thumbs.length) };
    if(isSticker){
      const anim = mime==="application/x-tgsticker" || mime==="video/webm";
      return { ...base, type:"sticker", animated: anim };
    }
    if(au && au.voice) return { ...base, type:"voice", duration: au.duration };
    if(vi && vi.roundMessage) return { ...base, type:"round", duration: vi.duration };
    if(isGif || (mime==="video/mp4" && !vi?.supportsStreaming && attrs.some(a=>a.className==="DocumentAttributeAnimated"))) return { ...base, type:"gif" };
    if(mime.startsWith("video/")) return { ...base, type:"video", duration: vi?.duration };
    if(au || mime.startsWith("audio/")) return { ...base, type:"audio", duration: au?.duration, title: au?.title };
    if(mime.startsWith("image/") && mime!=="image/svg+xml") return { ...base, type:"photo", isDocPhoto:true };
    return { ...base, type:"document" };
  }
  return { type:null }; // webpage preview dll → teks sahaja
}

function serviceText(m){
  const a = m.action ? m.action.className : "";
  const map = {
    MessageActionChatAddUser:"menambah ahli", MessageActionChatJoinedByLink:"menyertai melalui pautan",
    MessageActionChatDeleteUser:"keluar dari kumpulan", MessageActionChatEditTitle:"menukar nama kumpulan",
    MessageActionChatEditPhoto:"menukar gambar kumpulan", MessageActionPinMessage:"menyemat mesej",
    MessageActionChatCreate:"mencipta kumpulan", MessageActionChannelCreate:"mencipta saluran",
    MessageActionPhoneCall:"panggilan telefon", MessageActionScreenshotTaken:"mengambil tangkapan skrin",
    MessageActionContactSignUp:"menyertai Telegram", MessageActionChatJoinedByRequest:"menyertai kumpulan",
  };
  let who = "";
  try{ who = m.sender ? entName(m.sender) : ""; }catch(e){}
  return (who? who+" ":"") + (map[a] || "aktiviti kumpulan");
}

function toMsg(m, cid){
  const id = String(m.id);
  const out = !!m.out;
  if(m.className==="MessageService"){
    return { id, msgId:id, service:true, text: serviceText(m), date: new Date(m.date*1000).toISOString() };
  }
  const media = detectMedia(m);
  let senderName = "", senderId = "";
  try{
    senderId = m.senderId ? String(m.senderId) : "";
    if(!out && m.sender) senderName = entName(m.sender);
  }catch(e){}
  const reactions = {};
  const myReacts = {};
  if(m.reactions && m.reactions.results){
    m.reactions.results.forEach(r=>{
      const emo = r.reaction && r.reaction.emoticon;
      if(!emo) return;
      reactions[emo] = r.count || 1;
      if(r.chosenOrder !== undefined && r.chosenOrder !== null) myReacts[emo] = true;
    });
  }
  let fwd = "";
  if(m.fwdFrom){
    fwd = m.fwdFrom.fromName || "";
    try{
      if(!fwd && m.fwdFrom.fromId){ const k = peerKey(m.fwdFrom.fromId); const fe = entities.get(k); if(fe) fwd = entName(fe); }
    }catch(e){}
    fwd = fwd || "seseorang";
  }
  const key = cid+":"+id;
  return {
    id, msgId:id, out, text: m.message || "",
    date: new Date(m.date*1000).toISOString(),
    edited: !!m.editDate,
    mediaType: media.type, media, mediaUrl: mediaCache.get(key) || null,
    fileName: media.fileName, fileSize: media.fileSize,
    replyTo: m.replyTo && m.replyTo.replyToMsgId ? String(m.replyTo.replyToMsgId) : null,
    senderName, senderId, reactions, myReacts, fwd,
    read: out && readOutbox.get(cid) >= m.id,
    delivered: out,
  };
}

function fillReplies(cid){
  const arr = chatMsgs[cid] || [];
  const byId = new Map(arr.map(x=>[x.id,x]));
  arr.forEach(x=>{
    if(!x.replyTo) return;
    const r = byId.get(x.replyTo);
    if(r){
      x.replyToName = r.out ? "Anda" : (r.senderName || activeChatData?.name || "");
      x.replyToText = r.text || (r.mediaType ? msgPreview(rawMsgs[cid]?.get(r.id)) : "");
    } else if(!x.replyToName){
      x.replyToName = "Mesej";
      x.replyToText = "";
    }
  });
}
async function fetchMissingReplies(cid){
  const arr = chatMsgs[cid] || [];
  const have = new Set(arr.map(x=>x.id));
  const missing = [...new Set(arr.filter(x=>x.replyTo && !have.has(x.replyTo)).map(x=>Number(x.replyTo)))].slice(0,50);
  if(!missing.length) return;
  try{
    const res = await client.getMessages(entities.get(cid), { ids: missing });
    const map = new Map();
    res.forEach(r=>{ if(r) map.set(String(r.id), r); });
    arr.forEach(x=>{
      const r = map.get(x.replyTo);
      if(r){
        x.replyToName = r.out ? "Anda" : (r.sender ? entName(r.sender) : (activeChatData?.name||""));
        x.replyToText = r.message || msgPreview(r);
      }
    });
    if(cid===activeChatId) renderMessages(cid, chatMsgs[cid], true);
  }catch(e){}
}

async function openChat(cid){
  activeChatId = String(cid);
  activeChatData = dialogs.find(d=>d.cid===activeChatId) || { cid, name:"Chat" };

  if(window.innerWidth <= 640){
    el("sidebar").classList.remove("open");
    try{ history.pushState({chat:activeChatId}, ""); }catch(e){}
  }
  el("empty-state").hidden = true;
  el("chat-view").hidden = false;

  const name = activeChatData.name || "Chat";
  el("chat-name").textContent = name;
  const av = el("chat-avatar");
  av.style.background = nameColor(name);
  if(avatarCache.get(activeChatId)) av.innerHTML = `<img src="${avatarCache.get(activeChatId)}" alt=""/>`;
  else av.textContent = avatarInitial(name);
  updateChatStatus();

  replyToMsg = null;
  el("reply-bar").hidden = true;
  el("typing-indicator").textContent = "";
  LM_BTN.hidden = true;
  oldestMsgId = null;
  viewingOld = false;
  el("jump-latest").hidden = true;
  closeChatSearch();
  renderDialogs();

  // 1) Papar cache / memori terus
  if(chatMsgs[activeChatId] && chatMsgs[activeChatId].length){
    renderMessages(activeChatId, chatMsgs[activeChatId]);
  } else {
    const cached = await cacheGet("msgs:"+activeChatId);
    if(cid !== activeChatId) return;
    if(Array.isArray(cached) && cached.length){
      cached.forEach(x=>{ x.mediaUrl = mediaCache.get(activeChatId+":"+x.id) || null; });
      renderMessages(activeChatId, cached);
    } else {
      el("msgs-wrap").innerHTML = '<div class="msgs-note">Memuatkan mesej...</div>';
    }
  }
  scrollToBottom();

  // 2) Tarik terkini dari Telegram
  if(!tgReady) return;
  const thisCid = activeChatId;
  try{
    const ent = entities.get(thisCid);
    if(!ent) throw new Error("Chat tidak dijumpai, tekan Sync");
    const res = await client.getMessages(ent, { limit: 50 });
    if(thisCid !== activeChatId) return;
    rawMsgs[thisCid] = new Map();
    const arr = [];
    for(let i=res.length-1;i>=0;i--){
      const m = res[i];
      rawMsgs[thisCid].set(String(m.id), m);
      arr.push(toMsg(m, thisCid));
    }
    chatMsgs[thisCid] = arr;
    oldestMsgId = arr.length ? Number(arr[0].id) : null;
    fillReplies(thisCid);
    renderMessages(thisCid, arr);
    scrollToBottom();
    saveMsgCache(thisCid);
    fetchMissingReplies(thisCid);
    markRead(thisCid);
  }catch(e){
    console.error(e);
    if(thisCid===activeChatId && !(chatMsgs[thisCid]||[]).length)
      el("msgs-wrap").innerHTML = `<div class="msgs-note err">Gagal muat mesej: ${escHtml(e.message||e)}</div>`;
  }
}

function saveMsgCache(cid){
  const arr = (chatMsgs[cid]||[]).slice(-50).map(x=>{ const c = {...x}; delete c.mediaUrl; return c; });
  cacheSet("msgs:"+cid, arr);
}

async function markRead(cid){
  const d = dialogs.find(x=>x.cid===cid);
  if(!d || !d.unread) return;
  try{
    await client.markAsRead(entities.get(cid));
    d.unread = 0;
    renderDialogs();
    cacheSet("dialogs", dialogs);
  }catch(e){}
}

function updateChatStatus(){
  const statusEl = el("chat-status");
  statusEl.className = "";
  const e = entities.get(activeChatId);
  const d = activeChatData || {};
  if(!e){ statusEl.textContent = d.isGroup?"kumpulan":""; return; }
  if(e.className==="User"){
    if(e.self){ statusEl.textContent = ""; return; }
    if(e.bot){ statusEl.textContent = "bot"; return; }
    const s = e.status ? e.status.className : "";
    if(s==="UserStatusOnline"){ statusEl.textContent = "dalam talian"; statusEl.className = "online"; }
    else if(s==="UserStatusOffline") statusEl.textContent = "terakhir dilihat "+fmtDate(e.status.wasOnline*1000).toLowerCase()+" "+fmtTime(e.status.wasOnline*1000);
    else if(s==="UserStatusRecently") statusEl.textContent = "dilihat baru-baru ini";
    else if(s==="UserStatusLastWeek") statusEl.textContent = "dilihat minggu lepas";
    else statusEl.textContent = "dilihat lama dahulu";
  } else {
    const n = e.participantsCount;
    statusEl.textContent = n ? n.toLocaleString("ms-MY")+(d.isChannel?" pelanggan":" ahli") : (d.isChannel?"saluran":"kumpulan");
  }
}

// RENDER MESEJ
// ══════════════════════════════════════════════════════════════════
function renderMessages(chatId, arr, keepScroll){
  const wrap = el("msgs-wrap");
  const fromBottom = wrap.scrollHeight - wrap.scrollTop;
  wrap.innerHTML = "";
  LM_BTN.hidden = (arr.length < 30) || !tgReady;
  wrap.appendChild(LM_BTN);

  let lastDate = null;
  arr.forEach((msg, i)=>{
    const msgDate = msg.date ? fmtDate(msg.date) : "";
    if(msgDate !== lastDate){
      lastDate = msgDate;
      const divider = document.createElement("div");
      divider.className = "date-divider";
      divider.innerHTML = `<span>${escHtml(msgDate)}</span>`;
      wrap.appendChild(divider);
    }
    if(msg.service){
      const s = document.createElement("div");
      s.className = "service-msg";
      s.innerHTML = `<span>${escHtml(msg.text)}</span>`;
      wrap.appendChild(s);
      return;
    }
    wrap.appendChild(buildMsgElement(msg, i>0 ? arr[i-1] : null));
  });
  if(keepScroll) wrap.scrollTop = wrap.scrollHeight - fromBottom;
  observeMedia();
}

function buildMsgElement(msg, prevMsg){
  const isOut = msg.out === true;
  const isGroup = activeChatData?.isGroup;
  const sameUser = prevMsg && !prevMsg.service && prevMsg.senderId === msg.senderId && !isOut;
  const showAvatar = !isOut && isGroup;

  const row = document.createElement("div");
  row.className = `msg-row ${isOut?"out":"in"}`;
  row.dataset.msgId = msg.id;

  let avatarHtml = "";
  if(showAvatar){
    avatarHtml = sameUser ? `<div class="msg-avatar-sm" style="visibility:hidden"></div>`
      : `<div class="msg-avatar-sm" style="background:${nameColor(msg.senderName)}" title="${escHtml(msg.senderName||'')}">${escHtml(avatarInitial(msg.senderName||"?"))}</div>`;
  }
  let senderHtml = "";
  if(isGroup && !isOut && !sameUser && msg.senderName){
    senderHtml = `<div class="msg-sender" style="color:${nameColor(msg.senderName)}">${escHtml(msg.senderName)}</div>`;
  }
  const isSticker = msg.mediaType==="sticker" || msg.mediaType==="round";
  const fwdHtml = msg.fwd ? `<div class="fwd-label">↪ Dimajukan daripada ${escHtml(msg.fwd)}</div>` : "";
  const tick = isOut ? buildTick(msg) : "";

  row.innerHTML = `
    ${avatarHtml}
    <div class="msg-bubble-wrap">
      ${senderHtml}
      <div class="bubble${isSticker?" bare":""}" data-msg-id="${escHtml(msg.id)}">
        ${fwdHtml}
        ${buildReplyQuote(msg)}
        ${buildBubbleContent(msg)}
        <div class="bubble-meta">
          ${msg.edited?'<span class="msg-time">disunting</span>':""}
          <span class="msg-time">${fmtTime(msg.date)}</span>
          ${tick}
        </div>
      </div>
      ${buildReactionsHtml(msg)}
    </div>`;

  const bubble = row.querySelector(".bubble");
  let pressTimer;
  bubble.addEventListener("contextmenu", e=>{ e.preventDefault(); buildCtxMenu(msg, isOut, e.clientX, e.clientY); });
  bubble.addEventListener("touchstart", ()=>{ pressTimer = setTimeout(()=>{
    const r = bubble.getBoundingClientRect(); buildCtxMenu(msg, isOut, r.left, r.bottom);
  }, 550); }, { passive:true });
  bubble.addEventListener("touchend", ()=> clearTimeout(pressTimer));
  bubble.addEventListener("touchmove", ()=> clearTimeout(pressTimer), { passive:true });
  let lastTap = 0;
  bubble.addEventListener("touchend", e=>{
    const now = Date.now();
    if(now-lastTap < 300) showReactionPickerById(msg);
    lastTap = now;
  });
  row.querySelectorAll(".reaction-chip").forEach(chip=>{
    chip.onclick = (e)=>{ e.stopPropagation(); sendReaction(msg, chip.dataset.emoji); };
  });
  row.querySelectorAll("[data-act]").forEach(b=>{
    b.onclick = (e)=>{ e.stopPropagation(); mediaAction(msg, b.dataset.act, b); };
  });
  return row;
}

function fmtDur(s){ s = Math.round(s||0); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }

function buildBubbleContent(msg){
  const t = msg.mediaType;
  const md = msg.media || {};
  const key = activeChatId+":"+msg.id;
  const cap = msg.text ? `<div class="msg-text">${linkify(escHtml(msg.text))}</div>` : "";
  const src = msg.mediaUrl || mediaCache.get(key);

  if(t==="photo" || t==="video" || t==="gif" || t==="sticker" || t==="round"){
    let inner;
    if(src){
      if(t==="gif") inner = `<video src="${src}" autoplay loop muted playsinline></video>`;
      else inner = `<img src="${src}" alt=""/>`;
    } else {
      inner = `<div class="media-ph" data-key="${escHtml(key)}" data-kind="${t}">${t==="sticker"?"🖼":t==="photo"?"📷":"🎬"}</div>`;
    }
    const play = (t==="video"||t==="round") ? `<div class="play-ov">▶${md.duration?" "+fmtDur(md.duration):""}</div>` : "";
    const cls = t==="sticker" ? "bubble-media sticker" : t==="round" ? "bubble-media round" : "bubble-media";
    const act = t==="sticker" ? "" : `data-act="${t==="photo"?"view-photo":t==="gif"?"none":"view-video"}"`;
    return `<div class="${cls}" ${act}>${inner}${play}</div>${cap}`;
  }
  if(t==="voice" || t==="audio"){
    const label = t==="voice" ? "Mesej suara" : escHtml(md.title || msg.fileName || "Audio");
    return `<div class="audio-bubble">
      <button data-act="play-audio" aria-label="Main">▶</button>
      <div class="audio-info"><div class="file-name">${label}</div><div class="file-size">${fmtDur(md.duration)} · ${fmtFileSize(msg.fileSize)}</div></div>
    </div>${cap}`;
  }
  if(t==="document"){
    const fname = msg.fileName || "Dokumen";
    return `<div class="file-bubble" data-act="download">
      <span class="file-icon">${fileIcon(fname)}</span>
      <div class="file-info">
        <div class="file-name">${escHtml(fname)}</div>
        <div class="file-size">${fmtFileSize(msg.fileSize)} · ketik untuk muat turun</div>
      </div>
    </div>${cap}`;
  }
  if(t==="location"){
    return `<div style="padding:4px 0">📍 <a href="https://maps.google.com/?q=${md.lat||0},${md.lng||0}" target="_blank" rel="noopener">${escHtml(md.title||"Lihat Lokasi")}</a></div>${cap}`;
  }
  if(t==="poll") return `<div>📊 <b>${escHtml(md.question||"Undian")}</b></div><div class="file-size">Buka dalam Telegram untuk mengundi</div>`;
  if(t==="contact") return `<div>👤 <b>${escHtml(md.name||"Kenalan")}</b><div class="file-size">${escHtml(md.phone||"")}</div></div>`;

const dlQueue = [];
let dlRunning = 0;
const dlPending = new Set();
function queueDownload(fn){
  return new Promise((res, rej)=>{
    dlQueue.push({ fn, res, rej });
    pumpQueue();
  });
}
function pumpQueue(){
  while(dlRunning < 3 && dlQueue.length){
    const j = dlQueue.shift();
    dlRunning++;
    j.fn().then(j.res, j.rej).finally(()=>{ dlRunning--; pumpQueue(); });
  }
}
function bestPhotoThumb(m){
  const sizes = m.media?.photo?.sizes || [];
  const i = sizes.findIndex(s=>s.type==="x");
  if(i>=0) return i;
  const j = sizes.findIndex(s=>s.type==="m");
  return j>=0 ? j : undefined;
}
async function downloadPreview(cid, id, kind){
  const key = cid+":"+id;
  if(mediaCache.has(key)) return mediaCache.get(key);
  const m = rawMsgs[cid]?.get(id);
  if(!m) return null;
  const info = detectMedia(m);
  let buf, mime = "image/jpeg";
  if(kind==="photo" && !info.isDocPhoto){
    buf = await client.downloadMedia(m, { thumb: bestPhotoThumb(m) });
  } else if(kind==="sticker" && !info.animated){
    buf = await client.downloadMedia(m, {}); mime = info.mime || "image/webp";
  } else if(kind==="gif" && info.fileSize < 3*1024*1024){
    buf = await client.downloadMedia(m, {}); mime = info.mime || "video/mp4";
  } else if(kind==="photo" && info.isDocPhoto && info.fileSize < 3*1024*1024){
    buf = await client.downloadMedia(m, {}); mime = info.mime;
  } else if(info.hasThumb){
    const n = (m.media.document.thumbs||[]).length;
    buf = await client.downloadMedia(m, { thumb: n-1 });
  }
  if(!buf || !buf.length) return null;
  const url = URL.createObjectURL(new Blob([buf], { type: mime }));
  mediaCache.set(key, url);
  return url;
}

let mediaObserver = null;
function observeMedia(){
  if(!tgReady) return;
  if(!mediaObserver){
    mediaObserver = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        const ph = en.target;
        mediaObserver.unobserve(ph);
        const key = ph.dataset.key;
        if(dlPending.has(key)) return;
        dlPending.add(key);
        const [cid, id] = [key.slice(0, key.lastIndexOf(":")), key.slice(key.lastIndexOf(":")+1)];
        queueDownload(()=>downloadPreview(cid, id, ph.dataset.kind)).then(url=>{
          dlPending.delete(key);
          const node = document.querySelector(`.media-ph[data-key="${CSS.escape(key)}"]`);
          if(!node) return;
          if(!url){ node.textContent = node.dataset.kind==="sticker"?"🖼":"📎"; node.classList.add("none"); return; }
          const msg = (chatMsgs[cid]||[]).find(x=>x.id===id);
          if(msg) msg.mediaUrl = url;
          node.outerHTML = node.dataset.kind==="gif" ? `<video src="${url}" autoplay loop muted playsinline></video>` : `<img src="${url}" alt=""/>`;
        }).catch(()=>{ dlPending.delete(key); });
      });
    }, { root: el("msgs-wrap"), rootMargin: "300px" });
  }
  document.querySelectorAll("#msgs-wrap .media-ph:not(.none)").forEach(ph=> mediaObserver.observe(ph));
}

async function downloadFull(cid, id, onProgress){
  const m = rawMsgs[cid]?.get(id);
  if(!m) throw new Error("Mesej tiada dalam memori, buka semula chat");
  const info = detectMedia(m);
  const buf = await client.downloadMedia(m, { progressCallback: (got, total)=>{
    if(onProgress && total) onProgress(Math.round(Number(got)/Number(total)*100));
  }});
  return new Blob([buf], { type: info.mime || "application/octet-stream" });
}
const fullCache = new Map();
async function getFullUrl(msg, label){
  const key = activeChatId+":"+msg.id;
  if(fullCache.has(key)) return fullCache.get(key);
  toast(label+"...", 60000);
  const blob = await downloadFull(activeChatId, msg.id, p=> toast(`${label}... ${p}%`, 60000));
  const url = URL.createObjectURL(blob);
  fullCache.set(key, url);
  el("toast").classList.remove("show");
  return url;
}

let currentAudio = null, currentAudioBtn = null;
async function mediaAction(msg, act, btn){
  try{
    if(act==="none") return;
    if(act==="view-photo"){
      const quick = msg.mediaUrl || mediaCache.get(activeChatId+":"+msg.id);
      if(quick) openMediaViewer(quick, "image");
      const full = await getFullUrl(msg, "Memuatkan gambar penuh");
      if(!el("media-viewer").hidden || !quick) openMediaViewer(full, "image");
    } else if(act==="view-video"){
      const url = await getFullUrl(msg, "Memuat turun video");
      openMediaViewer(url, "video");
    } else if(act==="play-audio"){
      if(currentAudio && currentAudioBtn===btn){
        if(currentAudio.paused){ currentAudio.play(); btn.textContent="⏸"; } else { currentAudio.pause(); btn.textContent="▶"; }
        return;
      }
      if(currentAudio){ currentAudio.pause(); if(currentAudioBtn) currentAudioBtn.textContent="▶"; }
      btn.textContent = "…";
      const url = await getFullUrl(msg, "Memuatkan audio");
      currentAudio = new Audio(url);
      currentAudioBtn = btn;
      currentAudio.onended = ()=>{ btn.textContent = "▶"; };
      await currentAudio.play().catch(()=> toast("Format audio tidak disokong browser ini"));
      btn.textContent = "⏸";
    } else if(act==="download"){
      const url = await getFullUrl(msg, "Memuat turun fail");
      showDownloadSheet(url, msg.fileName || "fail", msg.media?.mime || "application/octet-stream", msg.fileSize);
    }
  }catch(e){
    toast("Gagal: "+(e.message||e));
    if(btn && act==="play-audio") btn.textContent = "▶";
  }
}

let dialogReloadTimer = null;
function scheduleDialogReload(){
  clearTimeout(dialogReloadTimer);
  dialogReloadTimer = setTimeout(loadDialogs, 1500);
}

async function onNewMessage(ev){
  const m = ev.message;
  if(!m) return;
  const cid = peerKey(m.peerId);
  if(!cid) return;
  const d = dialogs.find(x=>x.cid===cid);
  if(!d || !entities.has(cid)){ scheduleDialogReload(); }
  else {
    d.lastMsg = msgPreview(m);
    d.lastMsgTime = new Date(m.date*1000).toISOString();
    d.lastOut = !!m.out;
    const viewing = cid===activeChatId && document.visibilityState==="visible";
    if(!m.out && !viewing) d.unread = (d.unread||0)+1;
    dialogs = [d, ...dialogs.filter(x=>x!==d)];
    renderDialogs();
    cacheSet("dialogs", dialogs);
  }
  if(cid===activeChatId && viewingOld){
    el("jump-latest").textContent = "⬇ Mesej baru";
  } else if(cid===activeChatId){
    if(!rawMsgs[cid]) rawMsgs[cid] = new Map();
    rawMsgs[cid].set(String(m.id), m);
    const arr = chatMsgs[cid] || (chatMsgs[cid] = []);
    // buang mesej sementara yang sama (hantaran kita)
    const tmp = arr.findIndex(x=>x.pending && m.out && x.text===m.message);
    if(tmp>=0) arr.splice(tmp,1);
    if(!arr.some(x=>x.id===String(m.id))) arr.push(toMsg(m, cid));
    fillReplies(cid);
    const wrap = el("msgs-wrap");
    const nearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 150;
    renderMessages(cid, arr, !nearBottom);
    if(nearBottom || m.out) scrollToBottom(true);
    el("typing-indicator").textContent = "";
    saveMsgCache(cid);
    if(!m.out && document.visibilityState==="visible"){
      client.markAsRead(entities.get(cid)).catch(()=>{});
    }
  } else if(!m.out && document.visibilityState!=="visible"){
    notify(d ? d.name : "Mesej baru", msgPreview(m));
  }
}

const typingTimers = {};
function onRawUpdate(u){
  if(!u || !u.className) return;
  try{
    const cn = u.className;
    if(cn==="UpdateUserTyping" || cn==="UpdateChatUserTyping" || cn==="UpdateChannelUserTyping"){
      let cid, who = "";
      if(cn==="UpdateUserTyping"){ cid = String(u.userId); }
      else if(cn==="UpdateChatUserTyping"){ cid = "-"+String(u.chatId); }
      else { cid = "-100"+String(u.channelId); }
      if(cid!==activeChatId) return;
      if(cn!=="UpdateUserTyping"){
        const uid = u.fromId && u.fromId.userId ? String(u.fromId.userId) : "";
        const e = entities.get(uid);
        who = e ? entName(e).split(" ")[0] : "Seseorang";
      }
      const cancel = u.action && u.action.className==="SendMessageCancelAction";
      const ti = el("typing-indicator");
      if(cancel){ ti.textContent = ""; return; }
      const verb = u.action && u.action.className==="SendMessageRecordAudioAction" ? "sedang merakam suara..." : "sedang menaip...";
      ti.textContent = (who? who+" ":"") + verb;
      clearTimeout(typingTimers[cid]);
      typingTimers[cid] = setTimeout(()=>{ if(cid===activeChatId) ti.textContent = ""; }, 6000);
    } else if(cn==="UpdateReadHistoryOutbox" || cn==="UpdateReadChannelOutbox"){
      const cid = cn==="UpdateReadChannelOutbox" ? "-100"+String(u.channelId) : peerKey(u.peer);
      readOutbox.set(cid, u.maxId);
      if(cid===activeChatId && chatMsgs[cid]){
        let changed = false;
        chatMsgs[cid].forEach(x=>{ if(x.out && !x.read && Number(x.id)<=u.maxId){ x.read = true; changed = true; } });
        if(changed) renderMessages(cid, chatMsgs[cid], true);
      }
    } else if(cn==="UpdateDeleteMessages" || cn==="UpdateDeleteChannelMessages"){
      const ids = new Set((u.messages||[]).map(String));
      const cids = cn==="UpdateDeleteChannelMessages" ? ["-100"+String(u.channelId)] : [activeChatId];
      cids.forEach(cid=>{
        if(!cid || !chatMsgs[cid]) return;
        const before = chatMsgs[cid].length;
        chatMsgs[cid] = chatMsgs[cid].filter(x=>!ids.has(x.id));
        if(cid===activeChatId && chatMsgs[cid].length!==before) renderMessages(cid, chatMsgs[cid], true);
      });
    } else if(cn==="UpdateEditMessage" || cn==="UpdateEditChannelMessage"){
      const m = u.message;
      if(!m) return;
      const cid = peerKey(m.peerId);
      if(cid===activeChatId && chatMsgs[cid]){
        const i = chatMsgs[cid].findIndex(x=>x.id===String(m.id));
        if(i>=0){
          rawMsgs[cid]?.set(String(m.id), m);
          const old = chatMsgs[cid][i];
          const nw = toMsg(m, cid);
          nw.replyToName = old.replyToName; nw.replyToText = old.replyToText;
          chatMsgs[cid][i] = nw;
          renderMessages(cid, chatMsgs[cid], true);
        }
      }
    } else if(cn==="UpdateUserStatus"){
      const cid = String(u.userId);
      const e = entities.get(cid);
      if(e) e.status = u.status;
      const d = dialogs.find(x=>x.cid===cid);
      if(d){ d.online = u.status && u.status.className==="UserStatusOnline"; }
      if(cid===activeChatId) updateChatStatus();
    }
  }catch(e){ /* abaikan */ }
}

function notify(title, body){
  try{
    if(!("Notification" in window) || Notification.permission!=="granted") return;
    navigator.serviceWorker?.getRegistration?.().then(reg=>{
      if(reg) reg.showNotification(title, { body, tag:"mygram" });
      else new Notification(title, { body });
    }).catch(()=>{ new Notification(title, { body }); });
  }catch(e){}
}

var LM_BTN = el("load-more-btn");
async function loadOlder(){
  if(!activeChatId || !oldestMsgId || loadingOlder || !tgReady) return;
  loadingOlder = true;
  const cid = activeChatId;
  LM_BTN.textContent = "Memuatkan...";
  try{
    const res = await client.getMessages(entities.get(cid), { limit: 50, offsetId: oldestMsgId });
    if(cid!==activeChatId) return;
    if(!res.length){ toast("Tiada lagi mesej lama"); LM_BTN.hidden = true; return; }
    const older = [];
    for(let i=res.length-1;i>=0;i--){
      rawMsgs[cid].set(String(res[i].id), res[i]);
      older.push(toMsg(res[i], cid));
    }
    chatMsgs[cid] = [...older, ...chatMsgs[cid]];
    oldestMsgId = Number(chatMsgs[cid][0].id);
    fillReplies(cid);
    renderMessages(cid, chatMsgs[cid], true);
    fetchMissingReplies(cid);
  }catch(e){ toast("Gagal: "+(e.message||e)); }
  finally{ loadingOlder = false; LM_BTN.textContent = "⬆ Muat mesej lama"; }
}

let viewingOld = false;
let searchTimer = null, searchSeq = 0;
function openChatSearch(){
  el("chat-search-bar").hidden = false;
  el("chat-search-inp").value = "";
  el("chat-search-count").textContent = "";
  el("chat-search-results").hidden = true;
  setTimeout(()=> el("chat-search-inp").focus(), 50);
}
function closeChatSearch(){
  el("chat-search-bar").hidden = true;
  el("chat-search-results").hidden = true;
  el("chat-search-results").innerHTML = "";
}
el("btn-chat-search-close").onclick = closeChatSearch;
el("chat-search-inp").addEventListener("input", ()=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runChatSearch, 450);
});
el("chat-search-inp").addEventListener("keydown", e=>{ if(e.key==="Enter"){ clearTimeout(searchTimer); runChatSearch(); }});
function hilite(text, q){
  const t = escHtml(text);
  const qq = escHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return qq ? t.replace(new RegExp(qq, "gi"), m=>`<mark>${m}</mark>`) : t;
}
async function runChatSearch(){
  const q = el("chat-search-inp").value.trim();
  const box = el("chat-search-results");
  if(!q){ box.hidden = true; el("chat-search-count").textContent = ""; return; }
  if(!tgReady){ toast("Belum bersambung ke Telegram"); return; }
  const cid = activeChatId, seq = ++searchSeq;
  el("chat-search-count").textContent = "...";
  try{
    const res = await client.getMessages(entities.get(cid), { search: q, limit: 50 });
    if(seq!==searchSeq || cid!==activeChatId) return;
    el("chat-search-count").textContent = res.length ? (res.length>=50?"50+":res.length) : "0";
    if(!res.length){ box.innerHTML = `<div class="pf-empty">Tiada mesej ditemui</div>`; box.hidden = false; return; }
    box.innerHTML = res.map(m=>{
      let who = m.out ? "Anda" : "";
      try{ if(!who) who = m.sender ? entName(m.sender) : (activeChatData?.name||""); }catch(e){}
      const txt = m.message || msgPreview(m);
      const i = txt.toLowerCase().indexOf(q.toLowerCase());
      const snip = i > 30 ? "…"+txt.slice(i-25) : txt;
      return `<div class="sr-item" data-id="${m.id}">
        <div class="sr-top"><b>${escHtml(who)}</b><span>${fmtDate(m.date*1000)} ${fmtTime(m.date*1000)}</span></div>
        <div class="sr-text">${hilite(snip, q)}</div>
      </div>`;
    }).join("");
    box.hidden = false;
    box.querySelectorAll(".sr-item").forEach(n=>{
      n.onclick = ()=>{ box.hidden = true; jumpToMessage(Number(n.dataset.id)); };
    });
  }catch(e){
    el("chat-search-count").textContent = "";
    toast("Gagal cari: "+(e.message||e));
  }
}
async function jumpToMessage(id){
  const cid = activeChatId;
  if((chatMsgs[cid]||[]).some(x=>x.id===String(id))){ scrollToMsg(String(id)); return; }
  toast("Mencari mesej...");
  try{
    const res = await client.getMessages(entities.get(cid), { offsetId: id, addOffset: -25, limit: 50 });
    if(cid!==activeChatId) return;
    if(!rawMsgs[cid]) rawMsgs[cid] = new Map();
    const arr = res.slice().sort((a,b)=>a.id-b.id).map(m=>{ rawMsgs[cid].set(String(m.id), m); return toMsg(m, cid); });
    chatMsgs[cid] = arr;
    oldestMsgId = arr.length ? Number(arr[0].id) : null;
    viewingOld = true;
    el("jump-latest").textContent = "⬇ Mesej terkini";
    el("jump-latest").hidden = false;
    fillReplies(cid);
    renderMessages(cid, arr);
    fetchMissingReplies(cid);
    setTimeout(()=> scrollToMsg(String(id)), 60);
  }catch(e){ toast("Gagal: "+(e.message||e)); }
}
el("jump-latest").onclick = ()=>{
  viewingOld = false;
  el("jump-latest").hidden = true;
  delete chatMsgs[activeChatId];
  openChat(activeChatId);
};

  // Info asas dulu

  if(e && e.className==="User"){
    if(e.phone) rows.push({ v:"+"+e.phone, k:"Telefon", copy:true });
    if(e.username) rows.push({ v:"@"+e.username, k:"Username", copy:true });
  } else if(e && e.username){
    rows.push({ v:"t.me/"+e.username, k:"Pautan", copy:true });
  }
  renderPfInfo(rows);
  setPfTab("media");
  if(!tgReady || !e) return;

  // Gambar profil besar
  if(d.hasPhoto){
    client.downloadProfilePhoto(e, { isBig:true }).then(buf=>{

      pfBigUrl = URL.createObjectURL(new Blob([buf], { type:"image/jpeg" }));

      const full = await client.invoke(new Api.users.GetFullUser({ id: e }));
      about = full.fullUser && full.fullUser.about || "";
    } else if(e.className==="Channel"){
      const full = await client.invoke(new Api.channels.GetFullChannel({ channel: e }));
      about = full.fullChat && full.fullChat.about || "";
    } else if(e.className==="Chat"){
      const full = await client.invoke(new Api.messages.GetFullChat({ chatId: e.id }));
      about = full.fullChat && full.fullChat.about || "";

    if(about && activeChatId===cid){
      rows.splice(1, 0, { v: about, k: e.className==="User" ? "Bio" : "Penerangan" });
      renderPfInfo(rows);
    }
  }catch(err){ /* bio tidak wajib */ }

const PF_FILTER = {
  media: ()=> new Api.InputMessagesFilterPhotoVideo(),
  files: ()=> new Api.InputMessagesFilterDocument(),
  links: ()=> new Api.InputMessagesFilterUrl(),
};
async function setPfTab(tab){
  pfTab = tab;
  document.querySelectorAll(".pf-tab").forEach(t=> t.classList.toggle("active", t.dataset.tab===tab));
  const box = el("pf-content");
  const cid = activeChatId;
  const cache = pfCache[cid] || (pfCache[cid] = {});
  if(cache[tab]){ renderPfTab(tab, cache[tab]); return; }
  if(!tgReady){ box.innerHTML = `<div class="pf-empty">Belum bersambung ke Telegram</div>`; return; }
  box.innerHTML = `<div class="pf-empty">Memuatkan...</div>`;
  try{
    const res = await client.getMessages(entities.get(cid), { filter: PF_FILTER[tab](), limit: 90 });
    if(!rawMsgs[cid]) rawMsgs[cid] = new Map();
    res.forEach(m=> rawMsgs[cid].set(String(m.id), m));
    cache[tab] = res;
    if(pfTab===tab && activeChatId===cid) renderPfTab(tab, res);
  }catch(e){
    if(pfTab===tab) box.innerHTML = `<div class="pf-empty">Gagal: ${escHtml(e.message||e)}</div>`;
  }
}
function extractLinks(m){
  const out = [];
  const text = m.message || "";
  (m.entities||[]).forEach(en=>{
    if(en.className==="MessageEntityTextUrl" && en.url) out.push(en.url);
    else if(en.className==="MessageEntityUrl") out.push(text.substr(en.offset, en.length));
  });
  const wp = m.media && m.media.webpage;
  if(wp && wp.url && !out.includes(wp.url)) out.push(wp.url);
  if(!out.length){ (text.match(/https?:\/\/[^\s<>"]+/g)||[]).forEach(u=>out.push(u)); }
  return { urls: [...new Set(out)], title: wp && wp.title, site: wp && wp.siteName };
}
function renderPfTab(tab, list){
  const box = el("pf-content");
  const cid = activeChatId;
  const label = { media:"media", files:"fail", links:"pautan" }[tab];
  if(!list.length){ box.innerHTML = `<div class="pf-empty">Tiada ${label} dalam chat ini</div>`; return; }

  if(tab==="media"){
    box.innerHTML = `<div class="pf-grid">${list.map(m=>{
      const info = detectMedia(m);
      const key = cid+":"+m.id;
      const src = mediaCache.get(key);
      const dur = (info.type==="video"||info.type==="gif"||info.type==="round") ? `<span class="dur">▶ ${fmtDur(info.duration)}</span>` : "";
      return `<div class="pf-tile" data-id="${m.id}" data-kind="${info.type||"photo"}">${src?`<img src="${src}" alt=""/>`:""}${dur}</div>`;
    }).join("")}</div>`;
    box.querySelectorAll(".pf-tile").forEach(t=>{
      const id = t.dataset.id;
      t.onclick = ()=>{
        const msg = toMsg(rawMsgs[cid].get(id), cid);
        mediaAction(msg, t.dataset.kind==="photo" ? "view-photo" : "view-video");
      };
      if(!t.querySelector("img")){
        queueDownload(()=> downloadPreview(cid, id, t.dataset.kind==="photo"?"photo":"video")).then(url=>{
          if(url && t.isConnected) t.insertAdjacentHTML("afterbegin", `<img src="${url}" alt=""/>`);
        }).catch(()=>{});
      }
    });
    return;
  }

  if(tab==="files"){
    box.innerHTML = `<div class="pf-list">${list.map(m=>{
      const info = detectMedia(m);
      const name = info.fileName || (info.type==="voice"?"Mesej suara":info.type==="audio"?"Audio":"Fail");
      return `<div class="pf-li" data-id="${m.id}">
        <div class="ico">${info.type==="voice"||info.type==="audio"?"🎵":fileIcon(name)}</div>
        <div class="tx"><div class="t1">${escHtml(name)}</div><div class="t2">${fmtFileSize(info.fileSize)} · ${fmtDate(m.date*1000)}</div></div>
      </div>`;
    }).join("")}</div>`;
    box.querySelectorAll(".pf-li").forEach(n=>{
      n.onclick = ()=> mediaAction(toMsg(rawMsgs[cid].get(n.dataset.id), cid), "download");
    });
    return;
  }

  // links
  box.innerHTML = `<div class="pf-list">${list.map(m=>{
    const L = extractLinks(m);
    if(!L.urls.length) return "";
    const first = L.urls[0];
    let host = "";
    try{ host = new URL(/^https?:/i.test(first)?first:"https://"+first).hostname.replace(/^www\./,""); }catch(e){}
    return `<div class="pf-li" data-id="${m.id}">
      <div class="ico">${escHtml((host[0]||"🔗").toUpperCase())}</div>
      <div class="tx">
        <div class="t1">${escHtml(L.title || host || first)}</div>
        ${L.urls.map(u=>`<div class="t2"><a href="${escHtml(/^https?:/i.test(u)?u:"https://"+u)}" target="_blank" rel="noopener">${escHtml(u)}</a></div>`).join("")}
        <div class="t2">${fmtDate(m.date*1000)}</div>
      </div>
    </div>`;
  }).join("")}</div>`;
  box.querySelectorAll(".pf-li").forEach(n=>{
    n.onclick = (e)=>{
      if(e.target.closest("a")) return;
      const id = Number(n.dataset.id);
      backFromProfile(()=> jumpToMessage(id));
    };
  });
}

  if(!activeChatId || !tgReady) return;

  if(now - lastTypingSent > 5000){

async function sendMessage(){
  if(!activeChatId) return;
  const text = msgInp.value.trim();
  if(!text) return;
  if(!tgReady){ toast("Belum bersambung ke Telegram"); return; }
  const cid = activeChatId;
  const ent = entities.get(cid);
  msgInp.value = "";
  msgInp.style.height = "auto";
  lastTypingSent = 0;

  const replyId = replyToMsg ? Number(replyToMsg.id) : undefined;
  const tempMsg = {
    id: "temp-"+Date.now(), out:true, text, pending:true, date: new Date().toISOString(),
    replyTo: replyId ? String(replyId) : null,
    replyToName: replyToMsg ? (replyToMsg.out?"Anda":(replyToMsg.senderName||activeChatData?.name)) : null,
    replyToText: replyToMsg ? replyToMsg.text : null,
  };
  cancelReply();
  const arr = chatMsgs[cid] || (chatMsgs[cid] = []);
  arr.push(tempMsg);
  renderMessages(cid, arr);
  scrollToBottom(true);
  try{
    const sent = await client.sendMessage(ent, { message: text, replyTo: replyId });
    const i = arr.indexOf(tempMsg);
    if(i>=0) arr.splice(i,1);
    if(sent && !arr.some(x=>x.id===String(sent.id))){
      rawMsgs[cid]?.set(String(sent.id), sent);
      const nm = toMsg(sent, cid);
      nm.replyToName = tempMsg.replyToName; nm.replyToText = tempMsg.replyToText;
      arr.push(nm);
    }
    if(cid===activeChatId) renderMessages(cid, arr);
    const d = dialogs.find(x=>x.cid===cid);
    if(d){ d.lastMsg = text; d.lastOut = true; d.lastMsgTime = new Date().toISOString(); dialogs = [d, ...dialogs.filter(x=>x!==d)]; renderDialogs(); }
    saveMsgCache(cid);
  }catch(e){
    tempMsg.pending = false; tempMsg.sendFailed = true;
    if(cid===activeChatId) renderMessages(cid, arr);
    toast("Gagal hantar: "+(e.message||e));
  }
}

// Tukar File browser → fail yang gramjs faham (CustomFile + buffer)
async function uploadToTelegram(file, onProgress){
  const buf = G.Buffer.from(await file.arrayBuffer());
  const cf = new G.CustomFile(file.name || "fail", file.size, "", buf);
  return await client.uploadFile({ file: cf, workers: 4, maxBufferSize: 2**31, onProgress });
}

async function sendFile(file, opts={}){
  if(!activeChatId || !tgReady){ toast("Belum bersambung ke Telegram"); return; }
  if(file.size > 500*1024*1024){ toast("Fail terlalu besar untuk phone (max 500MB)"); return; }
  const cid = activeChatId;
  const ent = entities.get(cid);
  const replyId = replyToMsg ? Number(replyToMsg.id) : undefined;
  const caption = opts.voice ? "" : msgInp.value.trim();
  if(caption){ msgInp.value = ""; msgInp.style.height = "auto"; }
  cancelReply();
  const isMedia = /^image\/(jpeg|png|webp)$|^video\//.test(file.type);
  toast("Memuat naik... 0%", 120000);
  try{
    const inputFile = await uploadToTelegram(file, (p)=> toast(`Memuat naik... ${Math.round(Number(p)*100)}%`, 120000));
    toast("Menghantar...", 60000);
    const params = {
      file: inputFile,
      caption,
      replyTo: replyId,
      forceDocument: !isMedia && !opts.voice,
      workers: 1,
    };
    if(opts.voice){
      params.voiceNote = true;
      params.attributes = [new Api.DocumentAttributeAudio({ voice:true, duration: opts.duration||0 })];
    }
    const sent = await client.sendFile(ent, params);
    toast("Dihantar ✓");
    if(sent && cid===activeChatId){
      rawMsgs[cid]?.set(String(sent.id), sent);
      // pratonton terus dari fail tempatan
      if(isMedia && file.type.startsWith("image/")) mediaCache.set(cid+":"+sent.id, URL.createObjectURL(file));
      const arr = chatMsgs[cid] || (chatMsgs[cid] = []);
      if(!arr.some(x=>x.id===String(sent.id))) arr.push(toMsg(sent, cid));
      fillReplies(cid);
      renderMessages(cid, arr);
      scrollToBottom(true);
      saveMsgCache(cid);
    }
  }catch(e){
    toast("Gagal hantar fail: "+(e.message||e), 4000);
  }
}

el("btn-voice").onclick = startVoiceRec;

let voiceMime = "";
async function startVoiceRec(){
  if(!activeChatId) return;
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voiceMime = ["audio/ogg;codecs=opus","audio/webm;codecs=opus","audio/mp4"].find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
    mediaRecorder = new MediaRecorder(stream, voiceMime ? { mimeType: voiceMime } : undefined);
    voiceChunks = [];
    voiceSeconds = 0;
    mediaRecorder.ondataavailable = e=> voiceChunks.push(e.data);
    mediaRecorder.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); sendVoiceNote(); };
    mediaRecorder.start();
    el("voice-overlay").hidden = false;
    el("voice-timer").textContent = "0:00";
    voiceTimerInt = setInterval(()=>{
      voiceSeconds++;
      el("voice-timer").textContent = fmtDur(voiceSeconds);
    }, 1000);
    client.invoke(new Api.messages.SetTyping({ peer: entities.get(activeChatId), action: new Api.SendMessageRecordAudioAction() })).catch(()=>{});
  }catch(e){ toast("Mikrofon tidak dibenarkan"); }
}
function stopVoiceRec(){
  clearInterval(voiceTimerInt);
  el("voice-overlay").hidden = true;
  if(mediaRecorder && mediaRecorder.state!=="inactive") mediaRecorder.stop();
}
function cancelVoiceRec(){
  clearInterval(voiceTimerInt);
  el("voice-overlay").hidden = true;
  if(mediaRecorder && mediaRecorder.state!=="inactive"){
    mediaRecorder.onstop = ()=>{ mediaRecorder.stream.getTracks().forEach(t=>t.stop()); };
    mediaRecorder.stop();
    voiceChunks = [];
  }
}
async function sendVoiceNote(){
  if(!voiceChunks.length) return;
  const isOgg = voiceMime.startsWith("audio/ogg");
  const type = isOgg ? "audio/ogg" : (voiceMime.split(";")[0] || "audio/webm");
  const ext = isOgg ? "ogg" : type==="audio/mp4" ? "m4a" : "webm";
  const blob = new Blob(voiceChunks, { type });
  const file = new File([blob], `voice_${Date.now()}.${ext}`, { type });
  await sendFile(file, { voice: isOgg, duration: voiceSeconds });
}

function buildCtxMenu(msg, isOut, x, y){
  if(msg.pending) return;

  const items = [];
  items.push({ icon:"💬", label:"Balas", action:()=> setReply(msg) });
  if(msg.text){

      navigator.clipboard.writeText(msg.text).then(()=>toast("Disalin")).catch(()=>toast("Salin gagal"));

    deleteTargetId = msg.id;
    el("btn-del-everyone").hidden = !(isOut || activeChatData?.isUser);

  menu.hidden = false;

  menu.style.left = Math.max(8, Math.min(x, window.innerWidth-w-8))+"px";
