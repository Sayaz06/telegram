<title>MyGram</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: full-height two-column app — sidebar (chat list) + main (conversation) */
:root {
  --bg: #f4f4f5;
  --bg-sidebar: #ffffff;
  --bg-chat: #efeae2;
  --bg-input: #ffffff;
  --fg: #1a1a1a;
  --fg-muted: #6b7280;
  --fg-time: #9ca3af;
  --accent: #2b72bc;
  --accent-fg: #ffffff;
  --bubble-out: #dcf8c6;
  --bubble-in: #ffffff;
  --bubble-out-fg: #1a1a1a;
  --divider: #e5e7eb;
  --hover: #f0f0f0;
  --active: #e8f0fb;
  --unread: #2b72bc;
  --header: #2b72bc;
  --header-fg: #ffffff;
  --input-border: #e5e7eb;
  --online: #31c48d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1c1c1e;
    --bg-sidebar: #252525;
    --bg-chat: #0d1117;
    --bg-input: #2c2c2e;
    --fg: #e5e7eb;
    --fg-muted: #9ca3af;
    --fg-time: #6b7280;
    --accent: #3b82f6;
    --accent-fg: #ffffff;
    --bubble-out: #2b5219;
    --bubble-in: #2c2c2e;
    --bubble-out-fg: #e5e7eb;
    --divider: #2d2d2f;
    --hover: #2d2d2f;
    --active: #1e3a5f;
    --unread: #3b82f6;
    --header: #1c2333;
    --header-fg: #e5e7eb;
    --input-border: #3d3d3f;
    --online: #31c48d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1c1e;
  --bg-sidebar: #252525;
  --bg-chat: #0d1117;
  --bg-input: #2c2c2e;
  --fg: #e5e7eb;
  --fg-muted: #9ca3af;
  --fg-time: #6b7280;
  --accent: #3b82f6;
  --accent-fg: #ffffff;
  --bubble-out: #2b5219;
  --bubble-in: #2c2c2e;
  --bubble-out-fg: #e5e7eb;
  --divider: #2d2d2f;
  --hover: #2d2d2f;
  --active: #1e3a5f;
  --unread: #3b82f6;
  --header: #1c2333;
  --header-fg: #e5e7eb;
  --input-border: #3d3d3f;
  --online: #31c48d;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column; overflow: hidden; }

/* ── AUTH SCREEN ── */
#auth-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100%; background: var(--bg);
}
.auth-card {
  background: var(--bg-sidebar); border-radius: 16px;
  padding: 40px 36px; width: min(400px, 92vw);
  box-shadow: 0 4px 32px rgba(0,0,0,.12);
  display: flex; flex-direction: column; gap: 20px;
}
.auth-logo {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--accent); display: flex; align-items: center; justify-content: center;
  margin: 0 auto 4px; font-size: 32px;
}
.auth-card h1 { text-align: center; font-size: 22px; font-weight: 600; }
.auth-card p { text-align: center; color: var(--fg-muted); font-size: 13px; line-height: 1.5; }
.auth-card input {
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--input-border);
  border-radius: 10px; background: var(--bg); color: var(--fg);
  font-size: 15px; font-family: inherit; outline: none; transition: border-color .15s;
}
.auth-card input:focus { border-color: var(--accent); }
.btn-primary {
  width: 100%; padding: 12px; background: var(--accent); color: var(--accent-fg);
  border: none; border-radius: 10px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .88; }
.auth-note { font-size: 11px; color: var(--fg-muted); text-align: center; }
.otp-inputs { display: flex; gap: 8px; justify-content: center; }
.otp-inputs input {
  width: 44px; height: 52px; text-align: center; font-size: 20px; font-weight: 600;
  padding: 0; border: 1.5px solid var(--input-border); border-radius: 10px;
}

/* ── APP LAYOUT ── */
#app { display: none; height: 100%; flex-direction: row; }
#app.visible { display: flex; }

/* SIDEBAR */
.sidebar {
  width: 340px; min-width: 280px; max-width: 400px;
  background: var(--bg-sidebar); display: flex; flex-direction: column;
  border-right: 1px solid var(--divider); flex-shrink: 0;
}
.sidebar-header {
  padding: 10px 14px; background: var(--header); color: var(--header-fg);
  display: flex; align-items: center; gap: 10px; min-height: 56px;
}
.sidebar-header h2 { font-size: 17px; font-weight: 600; flex: 1; }
.icon-btn {
  background: none; border: none; color: inherit; cursor: pointer;
  padding: 6px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.15); }
.sidebar-header .icon-btn:hover { background: rgba(255,255,255,.15); }

/* Chat list */
.chat-list { flex: 1; overflow-y: auto; }
.chat-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; cursor: pointer; transition: background .1s;
  border-bottom: 1px solid var(--divider);
}
.chat-item:hover { background: var(--hover); }
.chat-item.active { background: var(--active); }
.avatar {
  width: 50px; height: 50px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 18px; color: #fff; position: relative;
}
.avatar.online::after {
  content: ''; position: absolute; bottom: 2px; right: 2px;
  width: 12px; height: 12px; border-radius: 50%; background: var(--online);
  border: 2px solid var(--bg-sidebar);
}
.chat-info { flex: 1; min-width: 0; }
.chat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.chat-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-time { font-size: 11px; color: var(--fg-time); flex-shrink: 0; }
.chat-preview { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-top: 2px; }
.chat-last { font-size: 13px; color: var(--fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.unread-badge {
  background: var(--unread); color: #fff; border-radius: 10px;
  font-size: 11px; font-weight: 600; padding: 1px 6px; min-width: 18px; text-align: center;
}

/* MAIN CHAT */
.chat-main {
  flex: 1; display: flex; flex-direction: column; background: var(--bg-chat);
  min-width: 0;
}
.chat-header {
  background: var(--header); color: var(--header-fg);
  display: flex; align-items: center; gap: 12px; padding: 8px 14px; min-height: 56px;
  border-bottom: 1px solid rgba(0,0,0,.1);
}
.chat-header .avatar { width: 40px; height: 40px; font-size: 14px; }
.chat-header-info { flex: 1; }
.chat-header-name { font-weight: 600; font-size: 15px; }
.chat-header-status { font-size: 12px; opacity: .8; }

/* Messages */
.messages-area {
  flex: 1; overflow-y: auto; padding: 12px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.msg-date {
  text-align: center; font-size: 11px; color: var(--fg-muted);
  background: rgba(128,128,128,.18); display: inline-block;
  padding: 3px 10px; border-radius: 10px; align-self: center;
  margin: 8px 0;
}
.msg-row { display: flex; margin-bottom: 1px; }
.msg-row.out { justify-content: flex-end; }
.msg-row.in { justify-content: flex-start; }
.bubble {
  max-width: 68%; padding: 7px 10px 5px;
  border-radius: 12px; position: relative; font-size: 14px; line-height: 1.45;
}
.msg-row.out .bubble {
  background: var(--bubble-out); color: var(--bubble-out-fg);
  border-bottom-right-radius: 4px;
}
.msg-row.in .bubble {
  background: var(--bubble-in); color: var(--fg);
  border-bottom-left-radius: 4px;
}
.bubble-sender { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
.bubble-text { word-break: break-word; }
.bubble-meta {
  display: flex; align-items: center; justify-content: flex-end; gap: 3px;
  margin-top: 3px;
}
.bubble-time { font-size: 10px; color: var(--fg-time); }
.msg-row.out .bubble-time { color: rgba(0,0,0,.45); }
.tick { font-size: 11px; color: var(--accent); }
.bubble.sticker { background: none; padding: 0; }
.sticker-emoji { font-size: 52px; line-height: 1; display: block; }

/* Input */
.input-area {
  background: var(--bg-input); border-top: 1px solid var(--divider);
  padding: 8px 10px; display: flex; align-items: flex-end; gap: 8px;
}
.attach-btn, .send-btn {
  background: none; border: none; cursor: pointer; padding: 6px;
  border-radius: 50%; color: var(--fg-muted); display: flex; align-items: center;
  justify-content: center; flex-shrink: 0; transition: background .1s, color .1s;
}
.attach-btn:hover { background: var(--hover); color: var(--accent); }
.send-btn { background: var(--accent); color: #fff; width: 40px; height: 40px; }
.send-btn:hover { opacity: .88; }
.msg-input {
  flex: 1; border: none; outline: none; background: var(--bg);
  border: 1px solid var(--input-border); border-radius: 20px;
  padding: 9px 14px; font-size: 14px; font-family: inherit; color: var(--fg);
  resize: none; max-height: 120px; line-height: 1.4;
}
.msg-input::placeholder { color: var(--fg-muted); }

/* EMPTY STATE */
.empty-main {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--fg-muted);
}
.empty-main svg { opacity: .3; }
.empty-main p { font-size: 15px; }

/* MOBILE */
@media (max-width: 640px) {
  .sidebar { width: 100%; border-right: none; }
  .chat-main { display: none; }
  .chat-main.mobile-show { display: flex; }
  .sidebar.mobile-hide { display: none; }
  #app.visible { flex-direction: column; }
  .back-btn { display: flex !important; }
}
.back-btn { display: none; }

/* No search notice */
.no-search-notice {
  background: #fff3cd; color: #856404; border-radius: 8px;
  padding: 8px 12px; font-size: 12px; margin: 8px 12px; text-align: center;
  display: none;
}
</style>

<!-- AUTH SCREEN -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">✈️</div>
    <h1>MyGram</h1>
    <p id="auth-desc">Masukkan nombor telefon anda untuk log masuk</p>

    <!-- Step 1: Phone -->
    <div id="step-phone">
      <input type="tel" id="phone-input" placeholder="+60123456789" autocomplete="tel">
    </div>

    <!-- Step 2: OTP -->
    <div id="step-otp" hidden>
      <div class="otp-inputs">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
      </div>

    <!-- Step 3: 2FA -->
    <div id="step-2fa" hidden>
      <input type="password" id="password-input" placeholder="Kata laluan 2FA">

</div>

<!-- MAIN APP -->
<div id="app">
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="icon-btn" title="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <h2>MyGram</h2>
      <button class="icon-btn" id="compose-btn" title="Chat baru">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>

        <div class="chat-header-info">
          <div class="chat-header-name" id="active-name">-</div>

        </div>
        <button class="icon-btn" title="Maklumat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

        </button>
        <textarea class="msg-input" id="msg-input" placeholder="Taip mesej..." rows="1"></textarea>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>

</div>

<script>
// ── CONFIG ──
const BACKEND = 'https://your-railway-app.railway.app'; // Tukar ke URL Railway awak

// ── STATE ──
let state = { phone: '', phoneCodeHash: '', step: 'phone', activeChat: null, ws: null, chats: [], messages: {} };

// ── DEMO DATA (ganti dengan API calls sebenar) ──
const demoChats = [
  { id: '1', name: 'Ahmad Razif', last: 'Ok nanti saya hantar', time: '14:32', unread: 2, color: '#e74c3c', online: true, type: 'private' },
  { id: '2', name: 'Keluarga 👨‍👩‍👧', last: 'Mak: Jangan lupa balik Jumaat', time: '13:01', unread: 5, color: '#27ae60', online: false, type: 'group' },
  { id: '3', name: 'Siti Nurhaliza', last: 'Gambar dah hantar ✓✓', time: 'Kelmarin', unread: 0, color: '#8e44ad', online: false, type: 'private' },
  { id: '4', name: 'Kerja — Dev Team', last: 'Hafiz: PR dah merge bos', time: 'Kelmarin', unread: 0, color: '#2980b9', online: false, type: 'group' },
  { id: '5', name: 'Pejabat Pos Malaysia', last: '📦 Parcel anda sedang dalam transit', time: 'Isnin', unread: 1, color: '#d35400', online: false, type: 'channel' },
];

const demoMessages = {
  '1': [
    { id: 1, text: 'Eh, dah siap kerja tu?', from: 'Ahmad', out: false, time: '14:20' },
    { id: 2, text: 'Hampir siap, tinggal bahagian report je', from: 'Me', out: true, time: '14:21', read: true },
    { id: 3, text: 'Bila boleh hantar?', from: 'Ahmad', out: false, time: '14:22' },
    { id: 4, text: 'Petang ni boleh. Pukul 5 lebih kurang 👍', from: 'Me', out: true, time: '14:25', read: true },
    { id: 5, text: 'Ok nanti saya hantar', from: 'Ahmad', out: false, time: '14:32' },
  ],
  '2': [
    { id: 1, text: 'Abang dah beli barang dapur?', from: 'Adik', out: false, time: '12:10' },
    { id: 2, text: 'Belum lagi, nanti petang', from: 'Me', out: true, time: '12:15', read: true },
    { id: 3, text: 'Jangan lupa beli telur sekali', from: 'Adik', out: false, time: '12:16' },
    { id: 4, text: 'Mak: Jangan lupa balik Jumaat', from: 'Mak', out: false, time: '13:01' },
  ],
};

// ── RENDER CHAT LIST ──
function renderChatList(chats) {
  const list = document.getElementById('chat-list');
  list.innerHTML = '';
  chats.forEach(chat => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (state.activeChat?.id === chat.id ? ' active' : '');
    item.dataset.id = chat.id;
    item.innerHTML = `
      <div class="avatar${chat.online ? ' online' : ''}" style="background:${chat.color}">
        ${chat.name[0]}
      </div>
      <div class="chat-info">
        <div class="chat-row">
          <span class="chat-name">${chat.name}</span>
          <span class="chat-time">${chat.time}</span>
        </div>
        <div class="chat-preview">
          <span class="chat-last">${chat.last}</span>
          ${chat.unread ? `<span class="unread-badge">${chat.unread}</span>` : ''}
        </div>
      </div>`;
    item.addEventListener('click', () => openChat(chat));
    list.appendChild(item);
  });
}

// ── OPEN CHAT ──
function openChat(chat) {
  state.activeChat = chat;
  document.getElementById('active-name').textContent = chat.name;
  document.getElementById('active-status').textContent = chat.online ? 'dalam talian' : chat.type === 'group' ? `${Math.floor(Math.random()*8+2)} ahli` : 'terakhir dilihat baru-baru ini';
  const av = document.getElementById('active-avatar');
  av.textContent = chat.name[0];
  av.style.background = chat.color;
  if (chat.online) av.classList.add('online'); else av.classList.remove('online');

  document.getElementById('empty-state').hidden = true;
  document.getElementById('active-chat').hidden = false;

  renderMessages(demoMessages[chat.id] || []);
  renderChatList(demoChats);

  // Mobile: show chat, hide sidebar
  if (window.innerWidth <= 640) {
    document.getElementById('sidebar').classList.add('mobile-hide');
    document.getElementById('chat-main').classList.add('mobile-show');
  }

  // Mark unread as 0
  const c = demoChats.find(d => d.id === chat.id);
  if (c) c.unread = 0;
}

// ── RENDER MESSAGES ──
function renderMessages(msgs) {
  const area = document.getElementById('messages-area');
  area.innerHTML = '';
  let lastDate = '';

  msgs.forEach(msg => {
    const date = 'Hari ini';
    if (date !== lastDate) {
      const d = document.createElement('div');
      d.className = 'msg-date';
      d.textContent = date;
      area.appendChild(d);
      lastDate = date;
    }
    const row = document.createElement('div');
    row.className = 'msg-row ' + (msg.out ? 'out' : 'in');
    const ticks = msg.out ? (msg.read ? '✓✓' : '✓') : '';
    row.innerHTML = `
      <div class="bubble">
        ${!msg.out ? `<div class="bubble-sender">${msg.from}</div>` : ''}
        <div class="bubble-text">${msg.text}</div>
        <div class="bubble-meta">
          <span class="bubble-time">${msg.time}</span>
          ${ticks ? `<span class="tick">${ticks}</span>` : ''}
        </div>
      </div>`;
    area.appendChild(row);
  });
  area.scrollTop = area.scrollHeight;
}

// ── SEND MESSAGE ──
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !state.activeChat) return;

  const msgs = demoMessages[state.activeChat.id] || [];
  const now = new Date();
  const time = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  msgs.push({ id: msgs.length + 1, text, from: 'Me', out: true, time, read: false });
  demoMessages[state.activeChat.id] = msgs;

  // Update last message in list
  const chat = demoChats.find(c => c.id === state.activeChat.id);
  if (chat) { chat.last = text; chat.time = time; }

  renderMessages(msgs);
  renderChatList(demoChats);
  input.value = '';
  input.style.height = 'auto';

  // Real API call (uncomment bila Railway dah ready)
  // fetch(`${BACKEND}/chats/send`, { method:'POST', headers:{'Content-Type':'application/json'},
  //   body: JSON.stringify({ phone: state.phone, chatId: state.activeChat.id, text }) });
}

// ── AUTH FLOW ──
const authBtn = document.getElementById('auth-btn');
const authDesc = document.getElementById('auth-desc');

authBtn.addEventListener('click', async () => {
  if (state.step === 'phone') {
    const phone = document.getElementById('phone-input').value.trim();
    if (!phone) return;
    state.phone = phone;
    authDesc.textContent = `Kod OTP dihantar ke ${phone}`;
    document.getElementById('step-phone').hidden = true;
    document.getElementById('step-otp').hidden = false;
    document.getElementById('auth-note').textContent = 'Semak aplikasi Telegram anda untuk kod';
    state.step = 'otp';
    document.querySelector('.otp-digit').focus();

    // Real API: await fetch(`${BACKEND}/auth/send-code`, { method:'POST', ... })

  } else if (state.step === 'otp') {
    const digits = [...document.querySelectorAll('.otp-digit')].map(i => i.value).join('');
    if (digits.length !== 5) return;

    // Real API: verify code
    // Demo: terus masuk
    loginSuccess();

  } else if (state.step === '2fa') {
    const password = document.getElementById('password-input').value;
    if (!password) return;
    loginSuccess();
  }
});

function loginSuccess() {
  document.getElementById('auth-screen').hidden = true;
  const app = document.getElementById('app');
  app.classList.add('visible');
  renderChatList(demoChats);
}

// OTP auto-advance
document.querySelectorAll('.otp-digit').forEach((input, i, all) => {
  input.addEventListener('input', () => {
    if (input.value && i < all.length - 1) all[i + 1].focus();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !input.value && i > 0) all[i - 1].focus();
  });
});

// Auto-resize textarea
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('send-btn').addEventListener('click', sendMessage);

// Back button (mobile)
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('mobile-hide');
  document.getElementById('chat-main').classList.remove('mobile-show');
  state.activeChat = null;
  renderChatList(demoChats);
});
